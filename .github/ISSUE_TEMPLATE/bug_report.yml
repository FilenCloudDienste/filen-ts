name: Bug report
description: Something in a Filen app doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        - **Never post your password, recovery key, 2FA codes or login tokens.** We will never ask for them.
        - Exported logs and screenshots can show file and directory names. Look through them before you attach them.
        - Found a security issue? Don't open a public issue. Contact us at [https://support.filen.io](https://support.filen.io).
        - Account, billing or login help: [https://support.filen.io](https://support.filen.io).

  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Web
        - Desktop — macOS
        - Desktop — Windows
        - Desktop — Linux
        - iOS
        - Android
        - Several / not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drive & files
        - Photos
        - Videos
        - Audio
        - Notes
        - Chats & contacts
        - Office documents, spreadsheets, presentations, PDF
        - Previews
        - Sync
        - Network drive (mounts)
        - Transfers
        - Assistant
        - Settings & account
        - Login & sign-up
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: >
        Web: Settings › Advanced › About › Version (use the copy button).
        Desktop: Settings › Desktop › About.
        iOS: the version on the app's TestFlight or App Store page.
        Android: system Settings › Apps › Filen (version at the bottom) or the app's Google Play page.
        The exported logs include it too.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device, system and browser
      placeholder: "MacBook Air M2, macOS 26.1, Safari 26 / Pixel 8, Android 16"
    validations:
      required: true

  - type: dropdown
    id: account
    attributes:
      label: Account type
      options:
        - Free
        - Paid
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Desktop install type
      description: Desktop only.
      options:
        - DMG / ZIP (macOS)
        - Installer (Windows)
        - AppImage (Linux)
        - deb / rpm (Linux)
        - Other
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact text of any error message.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Drive
        2. Right-click a file and choose ...
        3. See the error
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Web: Settings › Advanced › Diagnostic logs › Export logs.
        Desktop: Settings › Desktop › Troubleshooting › Export logs.
        iOS and Android: More › Advanced › Export logs.
        Drag the exported file into this field. Look through it first: it can show file and directory names.
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag files here. Hide anything private first.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this bug isn't reported yet.
          required: true
        - label: I removed passwords, keys and anything else private from the text and attachments.
          required: true
