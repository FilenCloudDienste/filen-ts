name: Feature request
description: Suggest an improvement or something new
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Web
        - Desktop — macOS
        - Desktop — Windows
        - Desktop — Linux
        - iOS
        - Android
        - Several / not sure
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Drive & files
        - Photos
        - Videos
        - Audio
        - Notes
        - Chats & contacts
        - Office documents, spreadsheets, presentations, PDF
        - Previews
        - Sync
        - Network drive (mounts)
        - Transfers
        - Assistant
        - Settings & account
        - Login & sign-up
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's missing or getting in your way?
      description: Describe the problem, not only the solution. It helps us weigh alternatives.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this isn't requested yet.
          required: true
