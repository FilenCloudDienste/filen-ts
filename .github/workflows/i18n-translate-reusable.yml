name: i18n translate (reusable)

# The auto-translate job shared by i18n-translate.yml (filen-mobile) and i18n-web.yml (filen-web):
# checkout -> install -> run the package's translation pipeline -> open/update one rolling PR. Callers
# own triggers, permissions and concurrency; `github.*` here is the caller's context.
on:
  workflow_call:
    inputs:
      package-dir:
        description: 'Package directory, e.g. packages/filen-mobile'
        type: string
        required: true
      pnpm-filter:
        description: 'pnpm --filter selector for the package, e.g. @filen/mobile'
        type: string
        required: true
      branch:
        description: 'Fixed branch of the rolling PR; must differ per package or the PRs collide'
        type: string
        required: true
      title:
        description: 'Commit message and PR title'
        type: string
        required: true
      mode:
        description: "The caller's workflow_dispatch choice (delta|full), empty on push"
        type: string
        required: false
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  translate:
    runs-on: ubuntu-latest
    # Fork guard: run on workflow_dispatch (canonical repo only — dispatch isn't available on
    # forks), or on push events that originate from the canonical repository. Fork PRs never
    # receive secrets, but this is explicit belt-and-suspenders so the job never even starts there.
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.repository.full_name
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The DELTA baseline is the committed src/locales/.en-snapshot.json, not git history, so a
          # shallow checkout is fine. Kept at 2 (harmless) rather than 1 to avoid disturbing the PR step.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: ${{ inputs.package-dir }}
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
        run: pnpm install --frozen-lockfile --filter "$PNPM_FILTER..."

      # While the rolling PR is open, its catalogs, snapshot, manifest and resume records are the state
      # this run continues from, not main's: main's snapshot only advances when that PR merges, so a delta
      # against it would pay again for every English change the PR already translated. The PR step below
      # rebuilds the branch from main plus this working tree, so the PR keeps every earlier translation.
      # Without an open PR (merged, closed, or none yet) main's own files are the state.
      - name: Continue from the open translation PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch }}
          BASE: ${{ github.ref_name }}
          LOCALES_DIR: ${{ inputs.package-dir }}/src/locales
        run: |
          pr=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')

          if [ -z "$pr" ]; then
            echo "No open PR from $BRANCH into $BASE: continuing from $BASE's files."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BRANCH"

          # The pipeline's outputs only (the English source stays the pushed commit's). Removed first, so a
          # file the PR deleted (the resume records) is not kept from main. The pathspec's `*` also matches
          # dotfiles and `.sources/<lang>.json`.
          rm -f "${LOCALES_DIR:?}"/*.json "${LOCALES_DIR:?}/.en-snapshot.json" "${LOCALES_DIR:?}/.catalogs.json"
          rm -rf "${LOCALES_DIR:?}/.sources"
          git checkout FETCH_HEAD -- "$LOCALES_DIR/*.json"
          git reset -q
          echo "Continuing from PR #$pr ($BRANCH)."

      - name: Run translation pipeline
        id: translate
        working-directory: ${{ inputs.package-dir }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Callers pass their workflow_dispatch choice (delta|full, empty on push), and only an exact
          # 'full' maps to a flag. Resolved in env, then passed via a quoted shell variable — no input
          # value is interpolated into the run line.
          TRANSLATE_FLAG: ${{ inputs.mode == 'full' && '--full' || '' }}
          # A push only ever translates what one English change needs. More keys than this (summed over
          # every language; repository variable I18N_PUSH_MAX_KEYS, default 2700 = 100 English keys x 27
          # languages) means a lost baseline, so the run requests nothing and fails. A dispatch has no limit.
          MAX_KEYS_FLAG: ${{ github.event_name == 'push' && format('--max-keys={0}', vars.I18N_PUSH_MAX_KEYS || '2700') || '' }}
        # No `--` separator: pnpm forwards it to the script as a literal argument, and parseArgs would
        # reject it as an unknown target language. An empty flag still arrives as one empty argument,
        # which parseArgs skips.
        run: |
          status=0
          pnpm run translate-i18n "$TRANSLATE_FLAG" "$MAX_KEYS_FLAG" || status=$?

          if [ "$status" -eq 4 ]; then
            echo "::error title=i18n::More keys planned than a push may translate; nothing was requested. Check the log, then dispatch this workflow (mode delta) to translate them anyway."
          fi

          exit "$status"

      # Also after a failed translation: the catalogs and resume records hold every batch already paid for,
      # and the next run continues from this PR instead of requesting them again.
      - name: Create Pull Request
        if: always() && (steps.translate.outcome == 'success' || steps.translate.outcome == 'failure')
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          # FIXED branch (not per-run): peter-evans UPDATES this one rolling PR each run. Including
          # ${{ github.run_id }} here made every run open a NEW branch + PR, which — since these
          # machine translations rarely get merged — piled up dozens of stale auto-translate
          # branches. delete-branch still removes it when the PR is merged/closed.
          branch: ${{ inputs.branch }}
          delete-branch: true
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          labels: |
            i18n
            automated
          body: |
            ## Automated translation update

            This PR was generated by the **${{ github.workflow }}** workflow
            (`${{ inputs.package-dir }}/scripts/translate-i18n.ts`).

            The target-language catalogs (`${{ inputs.package-dir }}/src/locales/<lang>.json`)
            were (re)generated from the English source catalog.

            **These translations are machine-generated and need human review** before merging —
            check placeholders (`{{...}}`), `<link>…</link>` markup, plural forms, and tone.

            Every run continues from this PR's files while it is open, so each English change is
            translated once. Closing it unmerged discards those translations: the next push would
            request them again (up to the push key limit).

            > Note: PRs opened by the workflow's `GITHUB_TOKEN` do not trigger downstream CI
            > (lint / typecheck / tests). Merging this PR by hand runs the full CI on `main`.
