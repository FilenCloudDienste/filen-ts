name: i18n translate (reusable)

# The auto-translate job shared by i18n-translate.yml (filen-mobile) and i18n-web.yml (filen-web):
# checkout -> install -> run the package's translation pipeline -> open/update one rolling PR. Callers
# own triggers, permissions and concurrency; `github.*` here is the caller's context.
on:
  workflow_call:
    inputs:
      package-dir:
        description: 'Package directory, e.g. packages/filen-mobile'
        type: string
        required: true
      pnpm-filter:
        description: 'pnpm --filter selector for the package, e.g. @filen/mobile'
        type: string
        required: true
      branch:
        description: 'Fixed branch of the rolling PR; must differ per package or the PRs collide'
        type: string
        required: true
      title:
        description: 'Commit message and PR title'
        type: string
        required: true
      mode:
        description: "The caller's workflow_dispatch choice (delta|full), empty on push"
        type: string
        required: false
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  translate:
    runs-on: ubuntu-latest
    # Fork guard: run on workflow_dispatch (canonical repo only — dispatch isn't available on
    # forks), or on push events that originate from the canonical repository. Fork PRs never
    # receive secrets, but this is explicit belt-and-suspenders so the job never even starts there.
    if: github.event_name == 'workflow_dispatch' || github.repository == github.event.repository.full_name
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The DELTA baseline is the committed src/locales/.en-snapshot.json, not git history, so a
          # shallow checkout is fine. Kept at 2 (harmless) rather than 1 to avoid disturbing the PR step.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: ${{ inputs.package-dir }}
        env:
          PNPM_FILTER: ${{ inputs.pnpm-filter }}
        run: pnpm install --frozen-lockfile --filter "$PNPM_FILTER..."

      - name: Run translation pipeline
        working-directory: ${{ inputs.package-dir }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Callers pass their workflow_dispatch choice (delta|full, empty on push), and only an exact
          # 'full' maps to a flag. Resolved in env, then passed via a quoted shell variable — no input
          # value is interpolated into the run line.
          TRANSLATE_FLAG: ${{ inputs.mode == 'full' && '--full' || '' }}
        # No `--` separator: pnpm forwards it to the script as a literal argument, and parseArgs would
        # reject it as an unknown target language. An empty flag still arrives as one empty argument,
        # which parseArgs skips.
        run: pnpm run translate-i18n "$TRANSLATE_FLAG"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          # FIXED branch (not per-run): peter-evans UPDATES this one rolling PR each run. Including
          # ${{ github.run_id }} here made every run open a NEW branch + PR, which — since these
          # machine translations rarely get merged — piled up dozens of stale auto-translate
          # branches. delete-branch still removes it when the PR is merged/closed.
          branch: ${{ inputs.branch }}
          delete-branch: true
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          labels: |
            i18n
            automated
          body: |
            ## Automated translation update

            This PR was generated by the **${{ github.workflow }}** workflow
            (`${{ inputs.package-dir }}/scripts/translate-i18n.ts`).

            The target-language catalogs (`${{ inputs.package-dir }}/src/locales/<lang>.json`)
            were (re)generated from the English source catalog.

            **These translations are machine-generated and need human review** before merging —
            check placeholders (`{{...}}`), `<link>…</link>` markup, plural forms, and tone.

            > Note: PRs opened by the workflow's `GITHUB_TOKEN` do not trigger downstream CI
            > (lint / typecheck / tests). Merging this PR by hand runs the full CI on `main`.
