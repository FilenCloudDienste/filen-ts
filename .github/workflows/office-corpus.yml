name: Office corpus

# The office engines against the real-world corpus (packages/filen-office/corpus/manifest.json), the full
# Unicode conformance files and the ECMA-376 schemas. None is committed: each is downloaded, verified against
# its pinned SHA-256 and cached, so a warm run fetches nothing. Kept apart from tests.yml so the unit jobs stay fast.

on:
  workflow_dispatch:
    inputs:
      fuzz-seed:
        description: 'First fuzz seed (default: the run number, so each night tries new sequences)'
        required: false

  # Also nightly, with --check-remote: a warm cache never downloads, so this is what notices a source that has
  # gone away (GOV.UK attachments can) before the cache is ever rebuilt.
  schedule:
    - cron: '41 3 * * *'

  push:
    paths:
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-web/src/features/spreadsheet/**'
      - 'packages/filen-web/src/tests/spreadsheetXlsConvertCorpus.test.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/office-corpus.yml'

  pull_request:
    paths:
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-web/src/features/spreadsheet/**'
      - 'packages/filen-web/src/tests/spreadsheetXlsConvertCorpus.test.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/office-corpus.yml'

jobs:
  # Vitest's --shard splits the test files by a hash of their path, so the shards together run every file once.
  # Each runner keeps Vitest's default pool (CPUs - 1 workers), so a timing test shares its machine as it did
  # unsharded. One concurrency group per shard: shards sharing a group would cancel each other.
  test-office-corpus:
    concurrency:
      group: filen-office-corpus-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # The Open XML SDK suites add to each shard what the other suites take.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-office-corpus (${{ matrix.shard }}/4)
    env:
      # The tests' time bounds are set on developer machines; these runners' CPUs are slower. A complexity
      # regression still exceeds the scaled bounds.
      FILEN_PERF_BUDGET_SCALE: '3'
      # Where tools/openxml-validate/Directory.Build.props puts the Release build.
      FILEN_OFFICE_OOXML_VALIDATOR: ${{ github.workspace }}/packages/filen-office/node_modules/.cache/filen-office-openxml/bin/OpenXmlValidate/release/OpenXmlValidate.dll
      FILEN_OFFICE_DOTNET: dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          # A manifest change restores the previous corpus: the fetch then downloads only what is new and
          # removes what is gone.
          restore-keys: office-corpus-
      - name: Cache the Unicode data
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-unicode
          key: office-unicode-${{ hashFiles('packages/filen-office/src/scripts/unicodeTables.ts') }}
      - name: Fetch the corpus
        working-directory: packages/filen-office
        env:
          CHECK_REMOTE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$CHECK_REMOTE" = "true" ]; then
            pnpm run corpus:fetch --check-remote
          else
            pnpm run corpus:fetch
          fi
      # Downloads the pinned UCD files and regenerates the tables from them; they must match what is committed,
      # or the tests below would run against tables nobody committed.
      - name: Fetch the Unicode data
        working-directory: packages/filen-office
        run: pnpm exec tsx src/scripts/unicodeTables.ts && git diff --exit-code -- src
      # xmllint and the pinned ECMA-376 schemas, for the schema validation of written WordprocessingML; qpdf for
      # `qpdf --check` of the PDFs src/tests/pdfExportCorpus.test.ts exports.
      - name: Install xmllint and qpdf
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils qpdf
      - name: Cache the WordprocessingML schemas
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-wml
          key: office-wml-${{ hashFiles('packages/filen-office/src/scripts/wmlOrder.ts') }}
      - name: Fetch the WordprocessingML schemas
        working-directory: packages/filen-office
        run: pnpm run generate:wml-order --fetch
      # ECMA-376 Part 2 (relationships, content types, core properties) and the Dublin Core schemas core
      # properties import, for the schema oracle (src/tests/oracles/xsd.ts).
      - name: Cache the OPC schemas
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-opc
          key: office-opc-${{ hashFiles('packages/filen-office/src/tests/oracles/xsd.ts') }}
      - name: Fetch the OPC schemas
        working-directory: packages/filen-office
        run: pnpm exec tsx src/tests/oracles/xsd.ts --fetch
      # The Open XML SDK validator (tools/openxml-validate, net10.0), for every suite that checks an OOXML save
      # against it; the NuGet packages are cached on the locked restore.
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages/filen-office/tools/openxml-validate/packages.lock.json
      - name: Build the Open XML SDK validator
        working-directory: packages/filen-office/tools/openxml-validate
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
          test -f "$FILEN_OFFICE_OOXML_VALIDATOR" || { echo "::error::no validator at $FILEN_OFFICE_OOXML_VALIDATOR"; exit 1; }
      - name: Test
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
          FILEN_OFFICE_UNICODE_FULL: '1'
        run: pnpm test --shard=${{ matrix.shard }}/4
      # The web app's .xls/.xlt path (hucre's reader through the workbook worker's opener) over the same corpus.
      - name: Install the web app's dependencies
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Test the web app's .xls conversion
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: packages/filen-web
        env:
          FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
        run: pnpm exec vitest run src/tests/spreadsheetXlsConvertCorpus.test.ts

  # Nightly and on demand: a smaller sample of src/tests/pdfExportCorpus.test.ts's PDF exports against veraPDF's
  # PDF/UA-1 profile; its UA_ALLOWED lists the rules a source's export may fail, with why.
  pdf-ua-office-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-pdf-ua-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      # The installer veraPDF's GitHub release (veraPDF/veraPDF-library) points to, from software.verapdf.org, which
      # keeps every release; its .asc is signed by 13DD102B4DD69354D12DE5A83184863278B17FE7.
      VERAPDF_VERSION: 1.30.3
      VERAPDF_SHA256: b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59
      FILEN_OFFICE_VERAPDF: ${{ github.workspace }}/verapdf/verapdf
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Restore veraPDF
        id: verapdf-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/verapdf.zip
          key: verapdf-${{ env.VERAPDF_VERSION }}
      - name: Download veraPDF
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/verapdf.zip" \
            "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip"
          echo "${VERAPDF_SHA256}  $RUNNER_TEMP/verapdf.zip" | sha256sum -c -
      - name: Save veraPDF
        if: steps.verapdf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/verapdf.zip
          key: verapdf-${{ env.VERAPDF_VERSION }}
      # The IzPack installer, unattended: the CLI pack only.
      - name: Install veraPDF
        run: |
          echo "${VERAPDF_SHA256}  $RUNNER_TEMP/verapdf.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP/verapdf-installer"
          cat > "$RUNNER_TEMP/verapdf-install.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8" standalone="no"?>
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$(dirname "$FILEN_OFFICE_VERAPDF")</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="false"/>
              <pack index="1" name="veraPDF CLI" selected="true"/>
              <pack index="2" name="veraPDF Documentation" selected="false"/>
              <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -jar "$RUNNER_TEMP/verapdf-installer/verapdf-greenfield-${VERAPDF_VERSION}/verapdf-izpack-installer-${VERAPDF_VERSION}.jar" \
            "$RUNNER_TEMP/verapdf-install.xml"
          version=$("$FILEN_OFFICE_VERAPDF" --version)
          echo "$version"
          case "$version" in *"${VERAPDF_VERSION}"*) ;; *) echo "::error::expected veraPDF ${VERAPDF_VERSION}"; exit 1 ;; esac
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      - name: PDF/UA-1 of the exports
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/pdfExportCorpus.test.ts

  # Nightly and on demand: the paged-editing fuzz (edited layout = fresh layout of the saved file) and the writer
  # damage fuzz (Gate 2 against an independent reader) over the cached corpus, one new seed per run. Findings
  # name file, seed and mode; FILEN_OFFICE_FUZZ_SEED, _FILTER and _MODES replay one locally (src/tests/fuzz).
  fuzz-office-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-fuzz-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SEED: ${{ inputs.fuzz-seed || github.run_number }}
      FILEN_OFFICE_FUZZ_OUT: ${{ github.workspace }}/office-fuzz.jsonl
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      # The job above has just saved (or restored) it; the fetch only verifies it.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      # Each night lays out in one revision view, in turn (final, markup, original).
      - name: Pick the revision view
        run: echo "FILEN_OFFICE_FUZZ_VIEW=$(echo final markup original | cut -d' ' -f$(( FILEN_OFFICE_FUZZ_SEED % 3 + 1 )))" >> "$GITHUB_ENV"
      - name: Paged editing fuzz
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_FUZZ: '1'
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/paged.fuzz.test.ts
      # The first sequence of a file saves unedited; three edited ones follow.
      - name: Writer damage fuzz
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_FUZZ: '4'
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/damage.fuzz.test.ts
      - name: Upload the fuzz results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-fuzz-${{ github.run_number }}
          path: ${{ github.workspace }}/office-fuzz.jsonl
          retention-days: 14

  # Nightly and on demand: the scripted edit suite's saves of every corpus document in LibreOffice (headless):
  # each converts to PDF, ODT, flat ODT, text and DOCX, and the text and structure each edit added read the same
  # there as in our model (src/tests/interop).
  interop-libreoffice:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-interop-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SAVES: ${{ github.workspace }}/office-saves
      # The LibreOffice src/tests/interop/accepted.ts is checked against (its lo-26 entries), from The Document
      # Foundation's archive, which keeps every release; the distribution's LibreOffice is an older line.
      LIBREOFFICE_VERSION: 26.8.2.2
      LIBREOFFICE_SHA256: 8290c8f46cb33d6df8f681cb796e0697461ea070f86ec55b63c94d7eb9d9a476
      FILEN_OFFICE_SOFFICE: /opt/libreoffice26.8/program/soffice
      FILEN_OFFICE_INTEROP_WORK: ${{ github.workspace }}/office-interop
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      # Restored and saved apart, so a failing test run still keeps the download.
      - name: Restore LibreOffice
        id: libreoffice-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libreoffice.tar.gz
          key: libreoffice-deb-${{ env.LIBREOFFICE_VERSION }}
      - name: Download LibreOffice
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/libreoffice.tar.gz" \
            "https://downloadarchive.documentfoundation.org/libreoffice/old/${LIBREOFFICE_VERSION}/deb/x86_64/LibreOffice_${LIBREOFFICE_VERSION}_Linux_x86-64_deb.tar.gz"
          echo "${LIBREOFFICE_SHA256}  $RUNNER_TEMP/libreoffice.tar.gz" | sha256sum -c -
      - name: Save LibreOffice
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libreoffice.tar.gz
          key: libreoffice-deb-${{ env.LIBREOFFICE_VERSION }}
      # Writer and Math (without Math, Writer drops every OMML equation on import) with what they need. The
      # packages declare no system dependencies: the apt line holds the libraries their ELF files link.
      - name: Install LibreOffice
        run: |
          tarball="$RUNNER_TEMP/libreoffice.tar.gz"
          echo "${LIBREOFFICE_SHA256}  ${tarball}" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libx11-xcb1 libxext6 libxinerama1 libcairo2 \
            libcups2t64 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libnss3 libavahi-client3 libgssapi-krb5-2
          mkdir "$RUNNER_TEMP/libreoffice"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/libreoffice" --strip-components=2 --wildcards '*/DEBS/*.deb'
          cd "$RUNNER_TEMP/libreoffice"
          sudo dpkg -i libreoffice26.8-ure_*.deb libobasis26.8-ooofonts_*.deb libobasis26.8-core_*.deb \
            libobasis26.8-images_*.deb libreoffice26.8_*.deb libobasis26.8-en-us_*.deb libreoffice26.8-en-us_*.deb \
            libobasis26.8-writer_*.deb libreoffice26.8-writer_*.deb libobasis26.8-math_*.deb libreoffice26.8-math_*.deb
          version=$("$FILEN_OFFICE_SOFFICE" --version)
          echo "$version"
          case "$version" in "LibreOffice ${LIBREOFFICE_VERSION} "*) ;; *) echo "::error::expected LibreOffice ${LIBREOFFICE_VERSION}"; exit 1 ;; esac
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      - name: Save the scripted edits
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/script.fuzz.test.ts
      - name: Read them in LibreOffice
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_INTEROP_PER_FAMILY: '0'
        run: pnpm exec vitest run --reporter=verbose src/tests/docxInteropLibreOffice.test.ts
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-interop-${{ github.run_number }}
          path: ${{ github.workspace }}/office-interop/report-*.json
          retention-days: 14

  # Nightly and on demand: the fuzzers of the other formats with seeds of this run instead of their fixed ones (the
  # RTF, compound file and xlsx readers, the ODT writer, the presentation session). Each takes its own range, derived
  # from FILEN_OFFICE_FUZZ_SEED; the job summary lists every seed for a local replay.
  fuzz-office-formats:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-fuzz-formats-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SEED: ${{ inputs.fuzz-seed || github.run_number }}
      # Runs per ODT file and seeds per deck: four and two times what pnpm test runs.
      FILEN_OFFICE_ODT_FUZZ_RUNS: '12'
      FUZZ_SEEDS: '6'
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      # The ranges start millions apart; the ODT and deck seeds step by their count per run, so no two runs share one.
      - name: Pick the seeds
        run: |
          {
            echo "FILEN_OFFICE_RTF_FUZZ_SEED=$(( 1000000 + FILEN_OFFICE_FUZZ_SEED ))"
            echo "FILEN_OFFICE_CFB_FUZZ_SEED=$(( 2000000 + FILEN_OFFICE_FUZZ_SEED ))"
            echo "FILEN_OFFICE_XLSX_FUZZ_SEED=$(( 3000000 + FILEN_OFFICE_FUZZ_SEED ))"
            echo "FILEN_OFFICE_ODT_FUZZ_FROM=$(( FILEN_OFFICE_FUZZ_SEED * FILEN_OFFICE_ODT_FUZZ_RUNS ))"
            echo "FUZZ_FROM=$(( FILEN_OFFICE_FUZZ_SEED * FUZZ_SEEDS + 1 ))"
          } | tee -a "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"
      - name: Reader fuzz
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/rtfFuzz.test.ts src/tests/cfbFuzz.test.ts src/tests/xlsxReadFuzz.test.ts
      - name: ODT writer fuzz
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/odtWriterFuzz.test.ts
      - name: Presentation session fuzz
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/presentationSessionFuzz.test.ts

  # Nightly and on demand, for the spreadsheet engine over the cached corpus: the full recalculation against the
  # results Excel stored (sheetOracleCached.test.ts, its 0.995 gate), and the long sheet fuzz run, one new sequence
  # per workbook and run, in one mode a night (src/tests/fuzz/sheet).
  sheet-office-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-sheet-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SEED: ${{ inputs.fuzz-seed || github.run_number }}
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      - name: Recalculate against Excel's cached results
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_SHEET_RECALC: '1'
          FILEN_OFFICE_SHEET_RECALC_OUT: ${{ github.workspace }}/office-recalc.json
        run: pnpm exec vitest run --reporter=verbose src/tests/sheetOracleCached.test.ts
      - name: Upload the recalculation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-recalc-${{ github.run_number }}
          path: ${{ github.workspace }}/office-recalc.json
          if-no-files-found: ignore
          retention-days: 14
      # One sequence per workbook (a requested count below the workbooks' rounds up to one each); the seed's range
      # is apart from the format fuzzers'.
      - name: Pick the seed and mode
        run: |
          {
            echo "FILEN_OFFICE_SHEET_FUZZ_SEED=$(( 5000000 + FILEN_OFFICE_FUZZ_SEED ))"
            echo "FILEN_OFFICE_SHEET_FUZZ_MODES=$(echo sync race | cut -d' ' -f$(( FILEN_OFFICE_FUZZ_SEED % 2 + 1 )))"
          } | tee -a "$GITHUB_ENV" "$GITHUB_STEP_SUMMARY"
      - name: Sheet fuzz, long run
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_SHEET_FUZZ: '1'
          FILEN_OFFICE_SHEET_FUZZ_OUT: ${{ github.workspace }}/office-sheet-fuzz.jsonl
        run: pnpm exec vitest run --reporter=verbose src/tests/sheetFuzz.test.ts -t "long run"
      - name: Upload the sheet fuzz results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-sheet-fuzz-${{ github.run_number }}
          path: ${{ github.workspace }}/office-sheet-fuzz.jsonl
          if-no-files-found: ignore
          retention-days: 14

  # Nightly and on demand: every ODF save and conversion against the ODF Toolkit's odfvalidator (ODF 1.3) and,
  # where a suite also writes OOXML, the Open XML SDK validator. Each oracle adds no error its source lacks.
  odf-office-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-odf-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      # From Maven Central (org.odftoolkit:odfvalidator, the jar with its dependencies).
      ODFVALIDATOR_VERSION: 0.13.0
      ODFVALIDATOR_SHA256: 5684feec5cbdcd5783998978c096ac9ccea53a454e2d6ae803ce482d2336d1dc
      FILEN_OFFICE_ODFVALIDATOR: ${{ github.workspace }}/odfvalidator.jar
      FILEN_OFFICE_OOXML_VALIDATOR: ${{ github.workspace }}/packages/filen-office/node_modules/.cache/filen-office-openxml/bin/OpenXmlValidate/release/OpenXmlValidate.dll
      FILEN_OFFICE_DOTNET: dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # The corpus conversions of odsConvertCorpus.test.ts.
      FILEN_OFFICE_CONVERT_CORPUS: '1'
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Restore odfvalidator
        id: odfvalidator-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/odfvalidator.jar
          key: odfvalidator-${{ env.ODFVALIDATOR_VERSION }}
      - name: Download odfvalidator
        if: steps.odfvalidator-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$FILEN_OFFICE_ODFVALIDATOR" \
            "https://repo1.maven.org/maven2/org/odftoolkit/odfvalidator/${ODFVALIDATOR_VERSION}/odfvalidator-${ODFVALIDATOR_VERSION}-jar-with-dependencies.jar"
          echo "${ODFVALIDATOR_SHA256}  $FILEN_OFFICE_ODFVALIDATOR" | sha256sum -c -
      - name: Save odfvalidator
        if: steps.odfvalidator-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/odfvalidator.jar
          key: odfvalidator-${{ env.ODFVALIDATOR_VERSION }}
      - name: Verify odfvalidator
        run: echo "${ODFVALIDATOR_SHA256}  $FILEN_OFFICE_ODFVALIDATOR" | sha256sum -c -
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages/filen-office/tools/openxml-validate/packages.lock.json
      - name: Build the Open XML SDK validator
        working-directory: packages/filen-office/tools/openxml-validate
        run: |
          dotnet restore --locked-mode
          dotnet build -c Release --no-restore
          test -f "$FILEN_OFFICE_OOXML_VALIDATOR" || { echo "::error::no validator at $FILEN_OFFICE_OOXML_VALIDATOR"; exit 1; }
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      - name: Text saves and conversions
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/odtWriterSchema.test.ts src/tests/convertTextCorpus.test.ts
      - name: Spreadsheet saves and conversions
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/odsSaveOracle.test.ts src/tests/odsConvertCorpus.test.ts
      - name: Presentation saves
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        run: >-
          pnpm exec vitest run --reporter=verbose src/tests/presentationShowOracle.test.ts
          src/tests/presentationTransitionsOracle.test.ts src/tests/animPresetMatrix.test.ts
          src/tests/presentationMediaTiming.test.ts
