name: Office corpus

# The office engines against the real-world corpus (packages/filen-office/corpus/manifest.json), the full
# Unicode conformance files and the ECMA-376 schemas. None is committed: each is downloaded, verified against
# its pinned SHA-256 and cached, so a warm run fetches nothing. Kept apart from tests.yml so the unit jobs stay fast.

on:
  workflow_dispatch:
    inputs:
      fuzz-seed:
        description: 'First fuzz seed (default: the run number, so each night tries new sequences)'
        required: false

  # Also nightly, with --check-remote: a warm cache never downloads, so this is what notices a source that has
  # gone away (GOV.UK attachments can) before the cache is ever rebuilt.
  schedule:
    - cron: '41 3 * * *'

  push:
    paths:
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/office-corpus.yml'

  pull_request:
    paths:
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/office-corpus.yml'

jobs:
  # Vitest's --shard splits the test files by a hash of their path, so the shards together run every file once.
  # Each runner keeps Vitest's default pool (CPUs - 1 workers), so a timing test shares its machine as it did
  # unsharded. One concurrency group per shard: shards sharing a group would cancel each other.
  test-office-corpus:
    concurrency:
      group: filen-office-corpus-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-office-corpus (${{ matrix.shard }}/4)
    env:
      # The tests' time bounds are set on developer machines; these runners' CPUs are slower. A complexity
      # regression still exceeds the scaled bounds.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Cache the corpus
        uses: actions/cache@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          # A manifest change restores the previous corpus: the fetch then downloads only what is new and
          # removes what is gone.
          restore-keys: office-corpus-
      - name: Cache the Unicode data
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-unicode
          key: office-unicode-${{ hashFiles('packages/filen-office/src/scripts/unicodeTables.ts') }}
      - name: Fetch the corpus
        working-directory: packages/filen-office
        env:
          CHECK_REMOTE: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$CHECK_REMOTE" = "true" ]; then
            pnpm run corpus:fetch --check-remote
          else
            pnpm run corpus:fetch
          fi
      # Downloads the pinned UCD files and regenerates the tables from them; they must match what is committed,
      # or the tests below would run against tables nobody committed.
      - name: Fetch the Unicode data
        working-directory: packages/filen-office
        run: pnpm exec tsx src/scripts/unicodeTables.ts && git diff --exit-code -- src
      # xmllint and the pinned ECMA-376 schemas, for the schema validation of written WordprocessingML.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Cache the WordprocessingML schemas
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-wml
          key: office-wml-${{ hashFiles('packages/filen-office/src/scripts/wmlOrder.ts') }}
      - name: Fetch the WordprocessingML schemas
        working-directory: packages/filen-office
        run: pnpm run generate:wml-order --fetch
      # ECMA-376 Part 2 (relationships, content types, core properties) and the Dublin Core schemas core
      # properties import, for the schema oracle (src/tests/oracles/xsd.ts).
      - name: Cache the OPC schemas
        uses: actions/cache@v4
        with:
          path: packages/filen-office/node_modules/.cache/filen-office-opc
          key: office-opc-${{ hashFiles('packages/filen-office/src/tests/oracles/xsd.ts') }}
      - name: Fetch the OPC schemas
        working-directory: packages/filen-office
        run: pnpm exec tsx src/tests/oracles/xsd.ts --fetch
      - name: Test
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
          FILEN_OFFICE_UNICODE_FULL: '1'
        run: pnpm test --shard=${{ matrix.shard }}/4

  # Nightly and on demand: the paged-editing fuzz (edited layout = fresh layout of the saved file) and the writer
  # damage fuzz (Gate 2 against an independent reader) over the cached corpus, one new seed per run. Findings
  # name file, seed and mode; FILEN_OFFICE_FUZZ_SEED, _FILTER and _MODES replay one locally (src/tests/fuzz).
  fuzz-office-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-fuzz-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SEED: ${{ inputs.fuzz-seed || github.run_number }}
      FILEN_OFFICE_FUZZ_OUT: ${{ github.workspace }}/office-fuzz.jsonl
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      # The job above has just saved (or restored) it; the fetch only verifies it.
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      # Each night lays out in one revision view, in turn (final, markup, original).
      - name: Pick the revision view
        run: echo "FILEN_OFFICE_FUZZ_VIEW=$(echo final markup original | cut -d' ' -f$(( FILEN_OFFICE_FUZZ_SEED % 3 + 1 )))" >> "$GITHUB_ENV"
      - name: Paged editing fuzz
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_FUZZ: '1'
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/paged.fuzz.test.ts
      # The first sequence of a file saves unedited; three edited ones follow.
      - name: Writer damage fuzz
        if: ${{ !cancelled() }}
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_FUZZ: '4'
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/damage.fuzz.test.ts
      - name: Upload the fuzz results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-fuzz-${{ github.run_number }}
          path: ${{ github.workspace }}/office-fuzz.jsonl
          retention-days: 14

  # Nightly and on demand: the scripted edit suite's saves of every corpus document in LibreOffice (headless):
  # each converts to PDF, ODT, flat ODT, text and DOCX, and the text and structure each edit added read the same
  # there as in our model (src/tests/interop).
  interop-libreoffice:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test-office-corpus
    concurrency:
      group: filen-office-interop-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILEN_OFFICE_CORPUS: ${{ github.workspace }}/packages/filen-office/.corpus
      FILEN_OFFICE_FUZZ_SAVES: ${{ github.workspace }}/office-saves
      # The LibreOffice src/tests/interop/accepted.ts is checked against (its lo-26 entries), from The Document
      # Foundation's archive, which keeps every release; the distribution's LibreOffice is an older line.
      LIBREOFFICE_VERSION: 26.8.2.2
      LIBREOFFICE_SHA256: 8290c8f46cb33d6df8f681cb796e0697461ea070f86ec55b63c94d7eb9d9a476
      FILEN_OFFICE_SOFFICE: /opt/libreoffice26.8/program/soffice
      FILEN_OFFICE_INTEROP_WORK: ${{ github.workspace }}/office-interop
      # Slower runners, as in test-office-corpus.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      # Restored and saved apart, so a failing test run still keeps the download.
      - name: Restore LibreOffice
        id: libreoffice-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/libreoffice.tar.gz
          key: libreoffice-deb-${{ env.LIBREOFFICE_VERSION }}
      - name: Download LibreOffice
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/libreoffice.tar.gz" \
            "https://downloadarchive.documentfoundation.org/libreoffice/old/${LIBREOFFICE_VERSION}/deb/x86_64/LibreOffice_${LIBREOFFICE_VERSION}_Linux_x86-64_deb.tar.gz"
          echo "${LIBREOFFICE_SHA256}  $RUNNER_TEMP/libreoffice.tar.gz" | sha256sum -c -
      - name: Save LibreOffice
        if: steps.libreoffice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/libreoffice.tar.gz
          key: libreoffice-deb-${{ env.LIBREOFFICE_VERSION }}
      # Writer and Math (without Math, Writer drops every OMML equation on import) with what they need. The
      # packages declare no system dependencies: the apt line holds the libraries their ELF files link.
      - name: Install LibreOffice
        run: |
          tarball="$RUNNER_TEMP/libreoffice.tar.gz"
          echo "${LIBREOFFICE_SHA256}  ${tarball}" | sha256sum -c -
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libx11-xcb1 libxext6 libxinerama1 libcairo2 \
            libcups2t64 libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0t64 libnss3 libavahi-client3 libgssapi-krb5-2
          mkdir "$RUNNER_TEMP/libreoffice"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/libreoffice" --strip-components=2 --wildcards '*/DEBS/*.deb'
          cd "$RUNNER_TEMP/libreoffice"
          sudo dpkg -i libreoffice26.8-ure_*.deb libobasis26.8-ooofonts_*.deb libobasis26.8-core_*.deb \
            libobasis26.8-images_*.deb libreoffice26.8_*.deb libobasis26.8-en-us_*.deb libreoffice26.8-en-us_*.deb \
            libobasis26.8-writer_*.deb libreoffice26.8-writer_*.deb libobasis26.8-math_*.deb libreoffice26.8-math_*.deb
          version=$("$FILEN_OFFICE_SOFFICE" --version)
          echo "$version"
          case "$version" in "LibreOffice ${LIBREOFFICE_VERSION} "*) ;; *) echo "::error::expected LibreOffice ${LIBREOFFICE_VERSION}"; exit 1 ;; esac
      - name: Restore the corpus
        uses: actions/cache/restore@v4
        with:
          path: packages/filen-office/.corpus
          key: office-corpus-${{ hashFiles('packages/filen-office/corpus/manifest.json') }}
          restore-keys: office-corpus-
      - name: Fetch the corpus
        working-directory: packages/filen-office
        run: pnpm run corpus:fetch
      - name: Save the scripted edits
        working-directory: packages/filen-office
        run: pnpm exec vitest run --reporter=verbose src/tests/fuzz/script.fuzz.test.ts
      - name: Read them in LibreOffice
        working-directory: packages/filen-office
        env:
          FILEN_OFFICE_INTEROP_PER_FAMILY: '0'
        run: pnpm exec vitest run --reporter=verbose src/tests/docxInteropLibreOffice.test.ts
      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: office-interop-${{ github.run_number }}
          path: ${{ github.workspace }}/office-interop/report-*.json
          retention-days: 14
