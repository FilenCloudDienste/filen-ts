name: Typecheck

on:
  workflow_dispatch:

  push:
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-desktop/**'
      - 'packages/filen-office/**'
      - 'packages/filen-spellcheck/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/typecheck.yml'

  pull_request:
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-desktop/**'
      - 'packages/filen-office/**'
      - 'packages/filen-spellcheck/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/typecheck.yml'

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      filen-web: ${{ steps.filter.outputs.filen-web }}
      filen-mobile: ${{ steps.filter.outputs.filen-mobile }}
      filen-shared: ${{ steps.filter.outputs.filen-shared }}
      filen-office: ${{ steps.filter.outputs.filen-office }}
      filen-spellcheck: ${{ steps.filter.outputs.filen-spellcheck }}
      filen-desktop: ${{ steps.filter.outputs.filen-desktop }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            filen-web:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-web/**'
              - 'packages/filen-office/**'
              - 'packages/filen-shared/**'
              - 'packages/filen-spellcheck/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-mobile:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-mobile/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-shared:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-desktop:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-desktop/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-office:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-office/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-spellcheck:
              - '.github/workflows/typecheck.yml'
              - 'packages/filen-spellcheck/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'

  typecheck-web:
    needs: changes
    if: needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Typecheck
        working-directory: packages/filen-web
        run: pnpm run typecheck
  typecheck-mobile:
    needs: changes
    if: needs.changes.outputs.filen-mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-mobile
        run: pnpm install --frozen-lockfile --filter @filen/mobile...
      - name: Typecheck
        working-directory: packages/filen-mobile
        run: pnpm run typecheck
  typecheck-shared:
    needs: changes
    if: needs.changes.outputs.filen-shared == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-shared
        run: pnpm install --frozen-lockfile --filter @filen/shared...
      - name: Typecheck
        working-directory: packages/filen-shared
        run: pnpm run typecheck
  typecheck-desktop:
    needs: changes
    if: needs.changes.outputs.filen-desktop == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Electron never runs here, so its ~100 MB binary is not downloaded.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-desktop
        run: pnpm install --frozen-lockfile --filter @filen/desktop...
      - name: Typecheck
        working-directory: packages/filen-desktop
        run: pnpm run typecheck
  typecheck-office:
    needs: changes
    if: needs.changes.outputs.filen-office == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Typecheck
        working-directory: packages/filen-office
        run: pnpm run typecheck
  typecheck-spellcheck:
    needs: changes
    if: needs.changes.outputs.filen-spellcheck == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-spellcheck
        run: pnpm install --frozen-lockfile --filter @filen/spellcheck...
      - name: Typecheck
        working-directory: packages/filen-spellcheck
        run: pnpm run typecheck
