name: Lint

on:
  workflow_dispatch:

  push:
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-utils/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'

  pull_request:
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-utils/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'

concurrency:
  group: 'lint'
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      filen-web: ${{ steps.filter.outputs.filen-web }}
      filen-mobile: ${{ steps.filter.outputs.filen-mobile }}
      filen-utils: ${{ steps.filter.outputs.filen-utils }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            filen-web:
              - 'packages/filen-web/**'
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-mobile:
              - 'packages/filen-mobile/**'
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-utils:
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'

  lint-web:
    needs: changes
    if: needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Lint
        working-directory: packages/filen-web
        run: pnpm run lint
  lint-mobile:
    needs: changes
    if: needs.changes.outputs.filen-mobile == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-mobile
        run: pnpm install --frozen-lockfile --filter @filen/mobile...
      - name: Lint
        working-directory: packages/filen-mobile
        run: pnpm run lint
  lint-utils:
    needs: changes
    if: needs.changes.outputs.filen-utils == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-utils
        run: pnpm install --frozen-lockfile --filter @filen/utils...
      - name: Lint
        working-directory: packages/filen-utils
        run: pnpm run lint
