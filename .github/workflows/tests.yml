name: Tests

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Web e2e only: spec file(s) to run, e.g. e2e/downloads.spec.ts (all when empty)'
        required: false
        default: ''
      project:
        description: 'Web e2e only: Playwright project, e.g. webkit-read (all when empty)'
        required: false
        default: ''

  # The web e2e suite runs here only (and on dispatch), never per push: with all three browsers it takes
  # hours on the one shared live account.
  schedule:
    - cron: '17 2 * * *'

  push:
    paths:
      - 'packages/filen-shared/**'
      - 'packages/filen-desktop/**'
      - 'packages/filen-office/**'
      - 'packages/filen-spellcheck/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-web/**'
      - 'packages/filen-assistant-eval/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/tests.yml'

  pull_request:
    paths:
      - 'packages/filen-shared/**'
      - 'packages/filen-desktop/**'
      - 'packages/filen-office/**'
      - 'packages/filen-spellcheck/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-web/**'
      - 'packages/filen-assistant-eval/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/tests.yml'

jobs:
  changes:
    # The nightly run, and a dispatch naming e2e specs or a project, are the e2e suite alone: skipping this skips
    # every job gated on it.
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || (inputs.spec == '' && inputs.project == ''))
    runs-on: ubuntu-latest
    outputs:
      filen-shared: ${{ steps.filter.outputs.filen-shared }}
      filen-office: ${{ steps.filter.outputs.filen-office }}
      filen-spellcheck: ${{ steps.filter.outputs.filen-spellcheck }}
      filen-desktop: ${{ steps.filter.outputs.filen-desktop }}
      filen-mobile: ${{ steps.filter.outputs.filen-mobile }}
      filen-web: ${{ steps.filter.outputs.filen-web }}
      filen-assistant-eval: ${{ steps.filter.outputs.filen-assistant-eval }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            filen-shared:
              - '.github/workflows/tests.yml'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-office:
              - '.github/workflows/tests.yml'
              - 'packages/filen-office/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-spellcheck:
              - '.github/workflows/tests.yml'
              - 'packages/filen-spellcheck/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-desktop:
              - '.github/workflows/tests.yml'
              - 'packages/filen-desktop/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-mobile:
              - '.github/workflows/tests.yml'
              - 'packages/filen-mobile/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-web:
              - '.github/workflows/tests.yml'
              - 'packages/filen-web/**'
              - 'packages/filen-office/**'
              - 'packages/filen-shared/**'
              - 'packages/filen-spellcheck/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-assistant-eval:
              - '.github/workflows/tests.yml'
              - 'packages/filen-assistant-eval/**'
              - 'packages/filen-shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'

  test-shared:
    needs: changes
    if: needs.changes.outputs.filen-shared == 'true' || github.event_name == 'workflow_dispatch'
    # A superseded push to the same ref cancels its own in-flight run: this is a cheap unit job
    # that touches nothing shared, so only the newest commit's result is worth paying for. The web
    # job deliberately does NOT cancel — see its own concurrency block for why.
    concurrency:
      group: filen-shared-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-shared
        run: pnpm install --frozen-lockfile --filter @filen/shared...
      - name: Test
        working-directory: packages/filen-shared
        run: pnpm test
  test-office:
    needs: changes
    if: needs.changes.outputs.filen-office == 'true' || github.event_name == 'workflow_dispatch'
    # A superseded push to the same ref cancels its own in-flight run: this is a cheap unit job
    # that touches nothing shared, so only the newest commit's result is worth paying for. The web
    # job deliberately does NOT cancel — see its own concurrency block for why. One group per shard:
    # shards sharing a group would cancel each other.
    concurrency:
      group: filen-office-tests-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Vitest's --shard splits the test files by a hash of their path, so the shards together run every file
    # once. Each runner keeps Vitest's default pool (CPUs - 1 workers), so a timing test shares its machine
    # as it did unsharded.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: test-office (${{ matrix.shard }}/4)
    env:
      # The tests' time bounds are set on developer machines; these runners' CPUs are slower. A complexity
      # regression still exceeds the scaled bounds.
      FILEN_PERF_BUDGET_SCALE: '3'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-office
        run: pnpm install --frozen-lockfile --filter @filen/office...
      - name: Test
        working-directory: packages/filen-office
        run: pnpm test --shard=${{ matrix.shard }}/4
  # Rust (format, clippy, unit tests on the host) and the TypeScript side, whose tests run the built wasm.
  test-spellcheck:
    needs: changes
    if: needs.changes.outputs.filen-spellcheck == 'true' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: filen-spellcheck-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The dictionaries are built from pinned upstream sources (never committed) and verified against the
      # manifest; a cache hit skips the download.
      - name: Cache spellcheck dictionaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        working-directory: packages/filen-spellcheck
        run: pnpm install --frozen-lockfile --filter @filen/spellcheck...
      - name: Build dictionaries
        working-directory: packages/filen-spellcheck
        run: pnpm run build:dictionaries
      - name: Rust format and clippy
        working-directory: packages/filen-spellcheck
        run: pnpm run lint:rust
      - name: Rust tests
        working-directory: packages/filen-spellcheck
        run: pnpm run test:rust
      - name: Test
        working-directory: packages/filen-spellcheck
        run: pnpm test
  test-desktop:
    needs: changes
    if: needs.changes.outputs.filen-desktop == 'true' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: filen-desktop-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # Electron's postinstall downloads its zip from GitHub releases, which can answer 504 and leave the
      # Electron-backed test files unable to load; the download is cached per Electron version and saved at once.
      - name: Identify the Electron release
        id: electron
        run: echo "version=$(node -p "require('./packages/filen-desktop/package.json').dependencies?.electron ?? require('./packages/filen-desktop/package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - name: Restore the Electron download
        id: electron-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - name: Install dependencies
        working-directory: packages/filen-desktop
        run: pnpm install --frozen-lockfile --filter @filen/desktop...
      - name: Save the Electron download
        if: steps.electron-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}
      - name: Test
        working-directory: packages/filen-desktop
        run: pnpm test
  test-mobile:
    needs: changes
    if: needs.changes.outputs.filen-mobile == 'true' || github.event_name == 'workflow_dispatch'
    # A superseded push to the same ref cancels its own in-flight run: this is a cheap unit job
    # that touches nothing shared, so only the newest commit's result is worth paying for. The web
    # job deliberately does NOT cancel — see its own concurrency block for why.
    concurrency:
      group: filen-mobile-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-mobile
        run: pnpm install --frozen-lockfile --filter @filen/mobile...
      - name: Test
        working-directory: packages/filen-mobile
        run: pnpm test
  # The eval imports the shipped assistant loop, prompts and tool schemas from @filen/shared; its
  # typecheck, lint and unit suite need no model. arm64 because node-llama-cpp's prebuilt binaries are
  # optional dependencies a frozen install cannot skip: ~7 MB there against ~355 MB of x64 CPU, CUDA
  # and Vulkan builds. The arch is also in setup-node's cache key, so this store never displaces the
  # x64 jobs' one.
  eval-checks:
    needs: changes
    if: needs.changes.outputs.filen-assistant-eval == 'true' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: filen-assistant-eval-checks-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-assistant-eval
        run: pnpm install --frozen-lockfile --filter @filen/assistant-eval...
      - name: Typecheck
        working-directory: packages/filen-assistant-eval
        run: pnpm run typecheck
      - name: Lint
        working-directory: packages/filen-assistant-eval
        run: pnpm run lint
      - name: Test
        working-directory: packages/filen-assistant-eval
        run: pnpm test
  # Everything for filen-web that needs NO live account and NO secrets. Deliberately outside the
  # `filen-web-e2e` concurrency group below: these used to sit in that group, so a six-second unit
  # suite queued behind whatever ~35-minute e2e run happened to hold the account — turning the fastest
  # signal in the repo into the slowest. Runs in parallel with test-web, not before it, so neither
  # waits on the other. The unit suite runs in web-unit beside it.
  web-checks:
    needs: changes
    if: needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The dictionaries are built from pinned upstream sources (never committed) and verified against the
      # manifest; a cache hit skips the download.
      - name: Cache spellcheck dictionaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Check generated error kinds are up to date
        working-directory: packages/filen-web
        run: pnpm run gen:error-kinds && git diff --exit-code
      - name: Assert e2e hooks are absent from a production build
        # A property of the BUILD, so it belongs with the other account-free checks rather than behind
        # the e2e queue — and an e2e flake can no longer decide whether it runs at all.
        working-directory: packages/filen-web
        run: |
          rm -rf dist && pnpm run build
          if grep -rq 'filenE2E' dist; then
            echo 'E2E hooks leaked into the production build'
            exit 1
          fi
  # filen-web's unit suite, outside the e2e group like web-checks. Vitest's --shard splits the test files by a
  # hash of their path, so the shards together run every file once. The tests read only the spellchecker's
  # committed manifest, so no shard builds the wasm engine or the dictionaries.
  web-unit:
    needs: changes
    if: needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: web-unit (${{ matrix.shard }}/4)
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Unit tests
        working-directory: packages/filen-web
        run: pnpm run test --shard=${{ matrix.shard }}/4

  # The e2e matrix. With the repository variable E2E_ACCOUNT_PER_BROWSER = 'true', one job per browser,
  # each on its own runner, account (secrets FILEN_WEB_E2E_TEST_{EMAIL,PASSWORD}_<BROWSER>) and
  # concurrency group, so the three run at once. Unset, ONE job runs every browser on the shared account
  # in the one `filen-web-e2e` group, as before: three jobs in a single group would not serialise, GitHub
  # cancels all but the newest pending job of a group. A dispatched project runs only on its browser's
  # job; one outside a browser (a setup project) on chromium's. Beside the per-browser (premium) accounts, an
  # undispatched run checks the free tier's upgrade prompts on the shared account: only the specs that branch on
  # E2E_PREMIUM, on chromium.
  #
  # WebKit runs as two jobs on its one account. Its tests run one at a time per machine (its storage lock,
  # e2e/fixtures.ts), so on one runner the read, notes and chats lanes (~30 min) queued behind the write lane
  # (~110 min) instead of running beside it as on the other browsers' runners. webkit-write takes the
  # drive-write lane, webkit-rest the other three, so every resource's writes stay on ONE machine under its
  # cross-process account lock, and each job keeps its own group (a shared one would serialise the two) for
  # every run, narrowed or not: a dispatched webkit project goes to the job that owns its lane. What the second
  # runner adds on the account is its own setup chain: the debris sweep (age-windowed, so it never reaches a
  # live run's rows), a fixture tree under its own run id, and that tree's teardown, written beside the other
  # job the way the read lanes already read beside the write lane.
  e2e-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          PER_BROWSER: ${{ vars.E2E_ACCOUNT_PER_BROWSER }}
          E2E_PROJECT: ${{ inputs.project }}
          E2E_SPEC: ${{ inputs.spec }}
        run: |
          # name, browser, account, group suffix, projects (space-separated; empty runs every lane).
          entry() {
            printf '{"name":"%s","browser":"%s","account":"%s","group":"filen-web-e2e-%s","specs":"","projects":"%s"}' "$1" "$2" "$3" "$4" "$5"
          }
          chromium=$(entry chromium chromium CHROMIUM chromium '')
          firefox=$(entry firefox firefox FIREFOX firefox '')
          webkit_write=$(entry webkit-write webkit WEBKIT webkit webkit-write)
          webkit_rest=$(entry webkit-rest webkit WEBKIT webkit-rest 'webkit-read webkit-notes webkit-chats')
          free='{"name":"free-tier","browser":"chromium","account":"","group":"filen-web-e2e","specs":"e2e/menus.spec.ts e2e/settings.spec.ts e2e/public-links.spec.ts","projects":""}'
          if [ "$PER_BROWSER" != "true" ]; then
            include='[{"name":"all","browser":"all","account":"","group":"filen-web-e2e","specs":"","projects":""}]'
          else
            case "$E2E_PROJECT" in
              '') include="[$chromium,$firefox,$webkit_write,$webkit_rest$([ -n "$E2E_SPEC" ] || printf ',%s' "$free")]" ;;
              firefox-*) include="[$firefox]" ;;
              webkit-write) include="[$webkit_write]" ;;
              webkit-*) include="[$webkit_rest]" ;;
              *) include="[$chromium]" ;;
            esac
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  test-web:
    # Nightly and on dispatch only (see `schedule` above); pushes and PRs get web-checks.
    needs: e2e-matrix
    name: test-web (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-matrix.outputs.include) }}
    runs-on: ubuntu-latest
    # Playwright's globalTimeout (300 min) bounds the e2e step alone; the install, both production builds
    # and the browser install are unbounded, and a hang in any of them would hold the non-cancelling
    # group below for GitHub's 6h job default.
    timeout-minutes: 340
    # ONE group per ACCOUNT (per WebKit shard, see e2e-matrix above), and scoped to this job because it is
    # the only one that touches a live Filen test account — and two runs of one lane on one account would
    # write the same resource from two machines, which no cross-process lock orders. A per-ref group does
    # not serialise that at all: `push` and `pull_request` both fire for a same-repo branch, under two
    # different refs and so in two different groups.
    # cancel-in-progress stays false because cancelling is the other way to corrupt a run: a context
    # killed mid-write keeps the account-wide `drive-write` lease it was refreshing until the TTL
    # expires, blocking every later run. A superseded run therefore queues instead — GitHub only drops
    # jobs from the group that have not started yet, which by definition hold nothing.
    concurrency:
      group: ${{ matrix.group }}
      cancel-in-progress: false
    env:
      # The specs' time bounds are set on developer machines; these runners' CPUs are slower. A complexity
      # regression still exceeds the scaled bounds.
      FILEN_PERF_BUDGET_SCALE: '3'
      # The setup and teardown projects drive chromium whatever the lane browser.
      E2E_INSTALL: ${{ matrix.browser == 'all' && 'chromium firefox webkit' || matrix.browser == 'chromium' && 'chromium' || format('chromium {0}', matrix.browser) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The dictionaries are built from pinned upstream sources (never committed) and verified against the
      # manifest; a cache hit skips the download.
      - name: Cache spellcheck dictionaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      # The runner image id (ubuntu24, ubuntu26, ...) belongs in the Playwright cache key below, but it
      # cannot be read there: ImageOS lives in the runner PROCESS's environment, and the `env` context
      # does not inherit those — `${{ env.ImageOS }}` would silently expand to nothing. Promoting it
      # into GITHUB_ENV here is what makes it referable.
      - name: Identify the runner image
        run: echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
      # A Playwright release pins the browser builds it downloads, and the system packages they need, so its
      # version keys both caches below exactly. The lockfile changed with every unrelated dependency bump, and
      # each change missed.
      - name: Identify the Playwright release
        working-directory: packages/filen-web
        run: |
          version=$(pnpm exec playwright --version | awk '{print $2}')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "unexpected Playwright version: $version"; exit 1; }
          echo "PLAYWRIGHT_VERSION=$version" >> "$GITHUB_ENV"
      # Restored and saved as two steps rather than one actions/cache, whose save runs only when the whole job
      # succeeds: an e2e job seldom does, so the browsers were downloaded again on most runs.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # The arch and image id are in the key because the cached binaries are distro-specific while
          # the path Playwright installs them to (~/.cache/ms-playwright/<browser>-<revision>) carries
          # neither. Without them a `ubuntu-latest` rollover still HITS this key, restores binaries
          # built for the previous distro, and takes the install step's cache-hit branch below — which
          # only installs system libs and never re-downloads — so every browser launch fails with a
          # loader error until Playwright is bumped. Deliberately NO restore-keys: a prefix
          # restore is that same stale hit, reintroduced on purpose. The matrix entry is in it for the
          # same reason: each job installs a different set of browsers into that one path.
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_OS }}-${{ matrix.browser }}-${{ env.PLAYWRIGHT_VERSION }}
      # The system packages the browsers need. apt-get finds a package in /var/cache/apt/archives before it
      # downloads one, and the runner's mirror has served them at ~45 kB/s on some nights (firefox's 49 MB took
      # 18 minutes). A prefix restore is safe here, unlike the browsers': apt checks each deb against its index
      # and downloads whatever does not match.
      - name: Restore system packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: apt-cache
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_OS }}-${{ matrix.browser }}-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_OS }}-${{ matrix.browser }}-
      - name: Install Playwright browsers
        working-directory: packages/filen-web
        # On a cache hit the binaries are already there and only the system libs are missing.
        run: |
          if [ -d ~/apt-archives ]; then
            sudo find ~/apt-archives -maxdepth 1 -name '*.deb' -exec cp -t /var/cache/apt/archives {} +
          fi
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps $E2E_INSTALL
          else
            pnpm exec playwright install --with-deps $E2E_INSTALL
          fi
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      # Firefox on Linux advances a playing media element's clock only against a live audio sink, and the
      # runner has no sound server: playback reports playing with its position stuck at 0.
      - name: Start a null audio sink
        if: matrix.browser == 'all' || matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=e2e
          pactl set-default-sink e2e
      # After the audio sink, so its packages are among them. Nothing to save when apt kept no debs.
      - name: Collect system packages
        id: apt-collect
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-archives
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/apt-archives {} +
          echo "debs=$(find ~/apt-archives -maxdepth 1 -name '*.deb' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Save system packages
        if: steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-collect.outputs.debs != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: E2E tests
        working-directory: packages/filen-web
        # A dispatch can narrow the run to a spec and a project; both arrive through env, never inlined into
        # the script, and are refused unless they are plain paths and names. A per-browser job never falls
        # back to the shared account: its own secrets missing fails the job.
        run: |
          if [ -n "$E2E_ACCOUNT" ] && { [ -z "$FILEN_WEB_E2E_TEST_EMAIL" ] || [ -z "$FILEN_WEB_E2E_TEST_PASSWORD" ]; }; then
            echo "FILEN_WEB_E2E_TEST_EMAIL_$E2E_ACCOUNT / FILEN_WEB_E2E_TEST_PASSWORD_$E2E_ACCOUNT are not set"
            exit 1
          fi
          args=()
          # The free-tier job's own specs (e2e-matrix), plain paths.
          for spec in $MATRIX_SPECS; do
            [[ "$spec" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "invalid spec: $spec"; exit 1; }
            args+=("$spec")
          done
          # The dispatch's specs, space-separated; read -a splits without globbing.
          read -ra specs <<< "$E2E_SPEC"
          for spec in "${specs[@]}"; do
            [[ "$spec" =~ ^[A-Za-z0-9_./:-]+$ ]] || { echo "invalid spec: $spec"; exit 1; }
            args+=("$spec")
          done
          if [ -n "$E2E_PROJECT" ]; then
            [[ "$E2E_PROJECT" =~ ^[a-z0-9-]+$ ]] || { echo "invalid project: $E2E_PROJECT"; exit 1; }
            args+=("--project=$E2E_PROJECT")
          fi
          # A split browser's share of its lanes (e2e-matrix), plain names; the setup projects come with them. A
          # dispatched project already picked the job that owns it. Narrowed by spec, one share can match nothing,
          # which is not a failure; the other browsers' jobs still fail a spec that matches nowhere.
          if [ -z "$E2E_PROJECT" ] && [ -n "$MATRIX_PROJECTS" ]; then
            for project in $MATRIX_PROJECTS; do
              [[ "$project" =~ ^[a-z0-9-]+$ ]] || { echo "invalid project: $project"; exit 1; }
              args+=("--project=$project")
            done
            if [ -n "$E2E_SPEC" ]; then
              args+=("--pass-with-no-tests")
            fi
          fi
          if [ "$MATRIX_BROWSER" != "all" ]; then
            export E2E_BROWSER="$MATRIX_BROWSER"
          fi
          VITE_E2E=1 pnpm run test:e2e "${args[@]}"
        env:
          E2E_SPEC: ${{ inputs.spec }}
          E2E_PROJECT: ${{ inputs.project }}
          MATRIX_BROWSER: ${{ matrix.browser }}
          MATRIX_SPECS: ${{ matrix.specs }}
          MATRIX_PROJECTS: ${{ matrix.projects }}
          E2E_ACCOUNT: ${{ matrix.account }}
          FILEN_WEB_E2E_TEST_EMAIL: ${{ matrix.account == '' && secrets.FILEN_WEB_E2E_TEST_EMAIL || secrets[format('FILEN_WEB_E2E_TEST_EMAIL_{0}', matrix.account)] }}
          FILEN_WEB_E2E_TEST_PASSWORD: ${{ matrix.account == '' && secrets.FILEN_WEB_E2E_TEST_PASSWORD || secrets[format('FILEN_WEB_E2E_TEST_PASSWORD_{0}', matrix.account)] }}
          # The per-browser accounts' tier (repository variable E2E_PREMIUM); the shared account is free.
          E2E_PREMIUM: ${{ matrix.account != '' && vars.E2E_PREMIUM || '' }}
      # Tests that passed only on a retry, on the run's page even when it is green.
      - name: List flaky tests
        if: ${{ !cancelled() }}
        working-directory: packages/filen-web
        run: node scripts/e2e-flaky-summary.ts e2e-results.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-web-${{ matrix.name }}
          path: packages/filen-web/playwright-report
          retention-days: 14
