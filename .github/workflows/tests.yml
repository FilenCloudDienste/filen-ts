name: Tests

on:
  workflow_dispatch:

  push:
    paths:
      - 'packages/filen-utils/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'

  pull_request:
    paths:
      - 'packages/filen-utils/**'
      - 'packages/filen-mobile/**'
      - 'packages/filen-web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      filen-utils: ${{ steps.filter.outputs.filen-utils }}
      filen-mobile: ${{ steps.filter.outputs.filen-mobile }}
      filen-web: ${{ steps.filter.outputs.filen-web }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            filen-utils:
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-mobile:
              - 'packages/filen-mobile/**'
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'
            filen-web:
              - 'packages/filen-web/**'
              - 'packages/filen-utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'patches/**'
              - 'package.json'

  test-utils:
    needs: changes
    if: needs.changes.outputs.filen-utils == 'true' || github.event_name == 'workflow_dispatch'
    # A superseded push to the same ref cancels its own in-flight run: this is a cheap unit job
    # that touches nothing shared, so only the newest commit's result is worth paying for. The web
    # job deliberately does NOT cancel — see its own concurrency block for why.
    concurrency:
      group: filen-utils-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-utils
        run: pnpm install --frozen-lockfile --filter @filen/utils...
      - name: Test
        working-directory: packages/filen-utils
        run: pnpm test
  test-mobile:
    needs: changes
    if: needs.changes.outputs.filen-mobile == 'true' || github.event_name == 'workflow_dispatch'
    # A superseded push to the same ref cancels its own in-flight run: this is a cheap unit job
    # that touches nothing shared, so only the newest commit's result is worth paying for. The web
    # job deliberately does NOT cancel — see its own concurrency block for why.
    concurrency:
      group: filen-mobile-tests-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-mobile
        run: pnpm install --frozen-lockfile --filter @filen/mobile...
      - name: Test
        working-directory: packages/filen-mobile
        run: pnpm test
  # Everything for filen-web that needs NO live account and NO secrets. Deliberately outside the
  # `filen-web-e2e` concurrency group below: these used to sit in that group, so a six-second unit
  # suite queued behind whatever ~35-minute e2e run happened to hold the account — turning the fastest
  # signal in the repo into the slowest. Runs in parallel with test-web, not before it, so neither
  # waits on the other.
  web-checks:
    needs: changes
    if: needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The Vite production build (SDK wasm + full module graph) needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Check generated error kinds are up to date
        working-directory: packages/filen-web
        run: pnpm run gen:error-kinds && git diff --exit-code
      - name: React Compiler healthcheck
        working-directory: packages/filen-web
        run: pnpm run check:compiler
      - name: Unit tests
        working-directory: packages/filen-web
        run: pnpm run test
      - name: Assert e2e hooks are absent from a production build
        # A property of the BUILD, so it belongs with the other account-free checks rather than behind
        # the e2e queue — and an e2e flake can no longer decide whether it runs at all.
        working-directory: packages/filen-web
        run: |
          rm -rf dist && pnpm run build
          if grep -rq 'filenE2E\|filen.e2e.session' dist; then
            echo 'E2E hooks leaked into the production build'
            exit 1
          fi

  test-web:
    needs: changes
    # `push` is filtered to the default branch on purpose. For a same-repo branch `push` and
    # `pull_request` BOTH fire for the same commit, and because they carry different refs neither the
    # workflow nor the constant group below dedupes them — so one commit queued two full ~35-minute
    # live-account runs back to back. Worse, GitHub keeps only ONE pending job per group, so the run
    # dropped while pending was usually a NEWER commit's. The PR event stays the branch signal; push
    # covers main, where there is no PR event.
    if: |
      (needs.changes.outputs.filen-web == 'true' || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Playwright's globalTimeout bounds the e2e step alone; the install, both production builds and the
    # browser install are unbounded, and a hang in any of them would hold the non-cancelling
    # `filen-web-e2e` group below for GitHub's 6h job default.
    timeout-minutes: 150
    # ONE constant group, and scoped to this job because it is the only one that touches the shared live
    # Filen test account — there is exactly one, and setup/cleanup.setup.ts trashes then PERMANENTLY
    # DELETES every row matching the e2e debris prefixes, which includes a concurrently running suite's
    # live fixture root. A per-ref group does not serialise that at all: `push` and `pull_request` both
    # fire for a same-repo branch, under two different refs and so in two different groups.
    # cancel-in-progress stays false because cancelling is the other way to corrupt a run: a context
    # killed mid-write keeps the account-wide `drive-write` lease it was refreshing until the TTL
    # expires, blocking every later run. A superseded run therefore queues instead — GitHub only drops
    # jobs from the group that have not started yet, which by definition hold nothing.
    concurrency:
      group: filen-web-e2e
      cancel-in-progress: false
    env:
      # The Vite production build (SDK wasm + full module graph) needs more than the default heap.
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        working-directory: packages/filen-web
        run: pnpm install --frozen-lockfile --filter @filen/web...
      # The runner image id (ubuntu24, ubuntu26, ...) belongs in the Playwright cache key below, but it
      # cannot be read there: ImageOS lives in the runner PROCESS's environment, and the `env` context
      # does not inherit those — `${{ env.ImageOS }}` would silently expand to nothing. Promoting it
      # into GITHUB_ENV here is what makes it referable.
      - name: Identify the runner image
        run: echo "IMAGE_OS=$ImageOS" >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # The arch and image id are in the key because the cached binaries are distro-specific while
          # the path Playwright installs them to (~/.cache/ms-playwright/<browser>-<revision>) carries
          # neither. Without them a `ubuntu-latest` rollover still HITS this key, restores binaries
          # built for the previous distro, and takes the install step's cache-hit branch below — which
          # only installs system libs and never re-downloads — so every browser launch fails with a
          # loader error until someone touches the lockfile. Deliberately NO restore-keys: a prefix
          # restore is that same stale hit, reintroduced on purpose.
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.IMAGE_OS }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        working-directory: packages/filen-web
        # On a cache hit the binaries are already there and only the system libs are missing.
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox webkit
          else
            pnpm exec playwright install --with-deps chromium firefox webkit
          fi
      - name: E2E tests
        working-directory: packages/filen-web
        run: VITE_E2E=1 pnpm run test:e2e
        env:
          FILEN_WEB_E2E_TEST_EMAIL: ${{ secrets.FILEN_WEB_E2E_TEST_EMAIL }}
          FILEN_WEB_E2E_TEST_PASSWORD: ${{ secrets.FILEN_WEB_E2E_TEST_PASSWORD }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: packages/filen-web/playwright-report
          retention-days: 14
