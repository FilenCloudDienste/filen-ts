name: i18n translate (web)

# filen-web's counterpart of i18n-translate.yml (filen-mobile); the job itself is shared via
# i18n-translate-reusable.yml.
#
# TRIGGER: workflow_dispatch ONLY for now; the script translates into every language of
# @filen/shared/languages. Until the target catalogs exist, any run (a "delta" one too) translates
# every key for every language, so the push trigger stays off until the first full run (run locally,
# see packages/filen-web/scripts/README.md) has merged with its snapshot. Then add, like mobile:
#   push: { branches: [main], paths: ['packages/filen-web/src/locales/en/**'] }
# (target catalogs and the snapshot are workflow OUTPUTS, not triggers, or every run would fire on
# its own commit).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Translation mode'
        type: choice
        required: true
        default: 'delta'
        options:
          - delta
          - full

permissions:
  contents: write
  pull-requests: write

# Own group — deliberately NOT the same string as i18n-translate.yml's `i18n-translate-${{
# github.ref }}`. Concurrency groups are repo-global (not scoped per workflow file), so reusing
# mobile's exact group name would let a web dispatch cancel an in-flight MOBILE translation run
# (or vice versa) purely by sharing a ref.
# Queued, never cancelled: a cancelled run throws away translations already paid for.
concurrency:
  group: i18n-translate-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    uses: ./.github/workflows/i18n-translate-reusable.yml
    with:
      package-dir: packages/filen-web
      pnpm-filter: '@filen/web'
      branch: i18n/auto-translate-web
      title: 'i18n: update web translations'
      mode: ${{ inputs.mode }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
