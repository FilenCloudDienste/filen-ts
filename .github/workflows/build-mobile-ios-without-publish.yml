name: Build Mobile iOS (Simulator, Without Publish)

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'packages/filen-mobile/**'
      - 'packages/filen-utils/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'

concurrency:
  group: build-mobile-ios-without-publish
  cancel-in-progress: true

env:
  NODE_ENV: production
  APP_ENV: production
  # Inlined into the JS bundle by Metro (EXPO_PUBLIC_*); encrypts the secureStore MMKV fallback used
  # when the OS keychain is unavailable. Missing it crashes the app at launch (SecureStore
  # constructor throws). Set the SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY org/repo secret.
  EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY: ${{ secrets.SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY }}

jobs:
  build-ios-without-publish:
    runs-on: macos-26
    defaults:
      run:
        working-directory: packages/filen-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Write fallback encryption key to .env
        run: |
          if [ -z "${EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY}" ]; then
            echo "::error::EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY is empty - set the SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY org/repo secret"
            exit 1
          fi
          # @expo/env loads packages/filen-mobile/.env (the run working-directory) at Metro bundle time,
          # so EXPO_PUBLIC_* is inlined reliably even if the env var doesn't propagate into the native
          # build's bundling subprocess. .env is gitignored; the always() Cleanup step removes it.
          printf 'EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY=%s\n' "${EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY}" > .env

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: rust-src
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      # filen-rs heif-decoder builds its vendored dav1d with meson + ninja.
      - name: Install build tools for heif-decoder's vendored dav1d
        run: brew install meson ninja

      # The workflow-level NODE_ENV=production makes yarn skip the prepare script that builds the
      # uniffi-bindgen-react-native git dependency; pnpm itself ignores NODE_ENV.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/mobile...
        env:
          NODE_ENV: development

      - name: Prebuild
        run: pnpm run superclean && pnpm exec expo prebuild --clean --platform ios --no-install

      - name: Install pods
        run: pod install --repo-update
        working-directory: packages/filen-mobile/ios

      - name: Build iOS app for simulator
        run: |
          set -o pipefail
          cd ios
          xcodebuild \
            -workspace Filen.xcworkspace \
            -scheme Filen \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            ARCHS=arm64 \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Build diagnostics
        if: failure()
        run: |
          echo "::group::disk and memory"; df -h; vm_stat; sysctl -n hw.ncpu hw.memsize; echo "::endgroup::"
          echo "::group::last errors"; grep -nE 'error:|\*\* BUILD FAILED|ld: |PhaseScriptExecution|fatal error' "$RUNNER_TEMP/xcodebuild.log" | tail -40; echo "::endgroup::"
          grep -E 'error:|\*\* BUILD FAILED|ld: ' "$RUNNER_TEMP/xcodebuild.log" | tail -8 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Cleanup
        if: always()
        run: |
          # Remove the .env holding the fallback encryption key
          rm -f .env

      - name: Upload iOS simulator .app bundle
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-app-test-${{ github.run_number }}
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphonesimulator/Filen.app
          retention-days: 90

      - name: Build summary
        run: |
          echo "## iOS Simulator Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/Filen.app" ]; then
            echo "- iOS Simulator .app bundle: Filen.app" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the Actions tab above. Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
