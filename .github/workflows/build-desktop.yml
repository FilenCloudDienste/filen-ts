# Packaging smoke test for filen-desktop: builds the web app it serves, bundles the shell and packs an unsigned
# Linux app directory with electron-builder (no installers, nothing signed or published), then checks what landed
# in it, and checks the Windows drag-out addon's crate (native/dragOut/win) on both Windows architectures. Signed
# installers are release-desktop.yml's job.
name: Build desktop

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'packages/filen-desktop/**'
      - 'packages/filen-web/**'
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-spellcheck/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'

  pull_request:
    paths:
      - 'packages/filen-desktop/**'
      - 'packages/filen-web/**'
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-spellcheck/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins. Same caches as the web workflows.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache spellcheck dictionaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web... --filter @filen/desktop...
      - name: Build web
        working-directory: packages/filen-web
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build
      - name: Package unsigned Linux app directory
        working-directory: packages/filen-desktop
        run: pnpm run dist -- --linux dir --x64
      - name: Check packaged app
        working-directory: packages/filen-desktop
        run: node scripts/checkPackage.ts linux x64

  # The Windows drag-out addon's crate (native/dragOut/win) on both Windows architectures: formatting and clippy for
  # both targets on x64, the unit tests natively on each.
  drag-addon:
    name: drag-addon (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            lint: true
          - runner: windows-11-arm
            lint: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: packages/filen-desktop/native/dragOut/win
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-desktop/native/dragOut/win/target
          key: drag-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-desktop/native/dragOut/win/rust-toolchain.toml', 'packages/filen-desktop/native/dragOut/win/Cargo.lock') }}
          restore-keys: drag-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        if: matrix.lint
        run: cargo fmt --check
      - name: Clippy (x64 and arm64)
        if: matrix.lint
        run: |
          cargo clippy --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo clippy --locked --all-targets --target aarch64-pc-windows-msvc -- -D warnings
      - name: Test
        run: cargo test --locked
