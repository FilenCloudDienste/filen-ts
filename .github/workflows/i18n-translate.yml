name: i18n translate

on:
  push:
    branches:
      - main
    paths:
      - 'packages/filen-mobile/src/locales/en/**'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Translation mode'
        type: choice
        required: true
        default: 'delta'
        options:
          - delta
          - full

permissions:
  contents: write
  pull-requests: write

# One rolling translation run per ref: a newer push to the English source cancels an in-flight run
# so the single auto-translate PR always reflects the latest source (and two runs never race on the
# fixed branch).
concurrency:
  group: i18n-translate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    uses: ./.github/workflows/i18n-translate-reusable.yml
    with:
      package-dir: packages/filen-mobile
      pnpm-filter: '@filen/mobile'
      branch: i18n/auto-translate
      title: 'i18n: update translations'
      mode: ${{ inputs.mode }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
