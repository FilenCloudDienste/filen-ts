name: i18n translate

on:
  push:
    branches:
      - main
    paths:
      - 'packages/filen-mobile/src/locales/en/**'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Translation mode'
        type: choice
        required: true
        default: 'delta'
        options:
          - delta
          - full

permissions:
  contents: write
  pull-requests: write

# One translation run per ref at a time, so two runs never race on the fixed branch. Queued, never
# cancelled: a cancelled run throws away translations already paid for. Only the newest queued run
# waits; GitHub drops older pending ones before they start, and the run that does start bases its
# delta on the open PR, so it translates only what changed since.
concurrency:
  group: i18n-translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    uses: ./.github/workflows/i18n-translate-reusable.yml
    with:
      package-dir: packages/filen-mobile
      pnpm-filter: '@filen/mobile'
      branch: i18n/auto-translate
      title: 'i18n: update translations'
      mode: ${{ inputs.mode }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
