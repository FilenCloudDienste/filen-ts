# Rolling staging deploy of filen-web to Cloudflare (the `staging` environment in
# packages/filen-web/wrangler.jsonc). The build emits dist/_headers, which carries every response
# header the app needs (packages/filen-web/README.md § Deployment).
# Secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN (an account API token with only Workers Scripts: Edit; wrangler
# reads it as CLOUDFLARE_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy web staging

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-office/**'
      - 'packages/filen-shared/**'
      - 'packages/filen-spellcheck/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/staging-web.yml'

permissions:
  contents: read

concurrency:
  # Only the newest main matters on a rolling deploy.
  group: 'staging-web'
  cancel-in-progress: true

jobs:
  staging-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The dictionaries are built from pinned upstream sources (never committed) and verified against the
      # manifest; a cache hit skips the download.
      - name: Cache spellcheck dictionaries
        uses: actions/cache@v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          FILEN_WEB_NOINDEX: '1'
        run: pnpm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging --message "${GITHUB_SHA}"
