# Rolling staging deploy of filen-web to Cloudflare (the `staging` environment in
# packages/filen-web/wrangler.jsonc). The build emits dist/_headers, which carries every response
# header the app needs (packages/filen-web/README.md § Deployment).
# Secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN (an account API token with only Workers Scripts: Edit; wrangler
# reads it as CLOUDFLARE_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy web staging

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'packages/filen-web/**'
      - 'packages/filen-shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'package.json'
      - '.github/workflows/staging-web.yml'

permissions:
  contents: read

concurrency:
  # Only the newest main matters on a rolling deploy.
  group: 'staging-web'
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  staging-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
          FILEN_WEB_NOINDEX: '1'
        run: pnpm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging --message "${GITHUB_SHA}"
