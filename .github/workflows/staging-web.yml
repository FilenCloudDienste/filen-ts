# Dormant until the web app is finished: this builds dist/ and uploads it as an artifact — there is
# no deploy step, and deploy wiring is done by hand.
# Whatever serves dist/ MUST send, on every response:
#   Cross-Origin-Opener-Policy: same-origin
#   Cross-Origin-Embedder-Policy: require-corp
#   Cross-Origin-Resource-Policy: same-origin      (all three, or the SDK's threaded wasm won't load)
#   Content-Security-Policy: the value of `CSP` in packages/filen-web/vite.config.ts
#   X-Content-Type-Options: nosniff
#   Referrer-Policy: no-referrer
#   Permissions-Policy: camera=(), microphone=(), geolocation=()
# plus application/wasm for .wasm and the caching rules in packages/filen-web/README.md § Deployment.
name: Build staging web artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'staging-web'
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  staging-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: packages/filen-web
        run: npm ci
      - name: Build
        working-directory: packages/filen-web
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filen-web-dist
          path: packages/filen-web/dist
