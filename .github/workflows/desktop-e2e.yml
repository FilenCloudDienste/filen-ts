# End-to-end tests of filen-desktop (PLAN §9, blocking for 4.0.0). On a runner of every platform and architecture that
# ships, each install format is installed the way a user installs it, launched, and updated by the app's own updater
# from a feed on the loopback interface that serves the candidate build N. The test then requires the app to relaunch
# at N from the same install location, with the same userData and a marker file in it intact
# (packages/filen-desktop/scripts/ci/e2e.ts). N must ship the pinned rclone for the runner's CPU, runnable from the
# install, and on Windows every install (and the update) must leave WinFsp installed; the test removes WinFsp between
# installs so that each installer has to bring it.
#
#   N-1 -> N      N-1 is the same commit built with a lower version, so the new updater, installer and uninstaller
#                 run against each other. Before its update, N-1 runs once against its own feed, which fails each
#                 check in another way (500, 404, a cut, a flipped byte, a truncated zip on macOS, a stall, an end
#                 mid-download; scripts/ci/e2e/updateFaults.ts).
#   3.0.53 -> N   the real last 3.x release, downloaded from the old repository's GitHub release and checked against
#                 pinned hashes: the path the whole installed fleet takes to 4.x. It is its old updater and its old
#                 NSIS uninstaller (run with --updated, which is what keeps %APPDATA%\@filen\desktop) that do the work.
#   3.0.47 -> N   an older 3.x (scenario `older`, scripts/ci/olderPlan.ts), which has no E2E hook: its update launch is
#                 hooked through its inspector to the same feed. Windows NSIS and Linux deb at install depth (the deb
#                 relaunches as /opt/Filen/@filendesktop, so N must come back through 4.x's link), at release and on
#                 Wednesday nights; at release deep (chain L from 3.0.47) on Windows NSIS, macOS dmg and Linux deb.
#
# Called by release-desktop.yml before anything is published, on the signed artifacts it built (candidate-from-run).
# Nightly (schedule) and by hand it builds N itself. Squirrel.Mac installs an update only if it satisfies the running
# app's designated requirement (Developer ID, Team 7YTW5D2K7P), which ad-hoc signed builds never do, so macOS is left
# out of unsigned runs. Signing per profile (scripts/ci/e2ePlan.ts): release and custom sign every build when `signed`
# is set (unsigned is the default by hand); nightly signs macOS with the Developer ID and leaves Windows unsigned (an
# update whose app-update.yml names no publisherName is not signature-checked). Nothing here is notarized.
#
# Depth (input `depth`, scripts/ci/e2ePlan.ts): install is the above. Deep also signs in and drives the apps around
# both updates. N-1 -> N (scripts/ci/e2e/chains/previous.ts): first run on a clean machine through N-1's page and the
# native folder chooser, three pairs, the drive, WebDAV, preferences and a PIN; after the update every one must hold
# with nothing transferred or rewritten. 3.0.53 -> N (scripts/ci/e2e/chains/legacy.ts): 3.0.53 signed in through its
# own page, given prefs, a PIN, the drive, WebDAV and five pairs (one per mode), settled, edited once on disk and once
# in the cloud while closed, then updated by its own updater; N must migrate it all with the two edits as the only
# changes. Chain P also fills a small local volume, syncs through a loopback CONNECT proxy only (direct egress blocked)
# with resets, a throttle and a slow first byte, holds Windows files locked, and on Linux x64 deb fills the quota
# account's storage (one more form sign-in, on that account). Both end with sign-out and uninstall. Deep is ready (scripts/ci/e2ePlan.ts DEEP_READY) per entry and
# chain; an entry being brought up (scripts/ci/e2ePlan.ts DEEP_TRIAL) runs deep only when a custom deep dispatch
# names it in `formats`; the rest run at install depth with a notice. Logins are rate-limited (90 an hour per IP) and
# an account's API key outlives every sign-out, so job `session` keeps one session per account slot in the Actions
# cache and logs in (@filen/sdk-rs) only when there is none usable, then hands the session, sealed, to every job that
# reaches the cloud or signs an app in. Per OS one 4.x chain (N-1 -> N) and one 3.0.53 chain (3.0.53 -> N) sign in
# through their real forms (rotated by the day at night, fixed otherwise; input `signin` real signs in every one),
# spaced by the plan's stagger, and one 3.0.47 chain a run; every other deep chain is seeded with the handed session as
# a sign-in stores it (scripts/ci/e2e/seed.ts). Job `session` first checks that the account's auth version is one every
# old client the run signs in or seeds can take; one 3.0.47 cannot take drops only the 3.0.47 chain, whose entries then
# run its install-only update. Each chain signs out at the end. A run logs in at most
# MAX_LOGINS_PER_RUN times (scripts/ci/e2ePlan.ts). Each run attempt and entry owns a cloud directory; `sweep` removes the run's and any older
# than a day, even after a failure.
#
# Chain K (scenario keyring, scripts/ci/e2e/chains/keyring.ts) runs on linux-x64-deb in every nightly and release run
# and by hand when `scenarios` names it: 3.0.53 given a synthetic signed-in profile, N installed over it, and N's 3.x
# import without a Secret Service, with a locked keyring whose prompt nobody answers, once it is unlocked, and after the
# 7-day wait for the wipe. No sign-in and no cloud: every launch of N runs behind the offline block, on a D-Bus session
# and Secret Service of its own.
#
# Gap 6 (scripts/ci/e2e/chains/realWorld.ts), chain P on linux-x64-deb, win-x64-nsis and mac-arm64-dmg: a remoteToLocal
# pair pulls the permanent scale tree (filen-desktop-e2e-fixtures/scale-v1.<time>, the generation its manifest names,
# about 8,500 entries, outside the swept root), which job `session` and the sweep check against its manifest once a
# run (unseeded: a warning) and input `scale_reseed` writes anew as a new generation, run alone;
# and, with input `names_check` (off: it expects an sdk-rs release not out yet), a two-way pair of hostile names.
#
# Spikes (by hand only, input `spike`) answer one question each, on one entry per OS, instead of the update scenarios;
# their findings go to the job summary and an artifact:
#   s1   are the packaged 3.0.53 and N drivable over --remote-debugging-port (3.0.53 also over --inspect), and does
#        SIGTERM quit N gracefully
#   s7   Filen in Finder on signed macOS: sign-in, enable, off/on round trip, domain registration (userEnabled stays
#        false without a person; reported as information). Signs in once with the e2e account and signs out after
#   cloud  the harness's cloud side alone (no app, no build): the session hand-off, then a run directory created,
#        listed, given a new file version, diffed, read back, moved within and deleted, and the account's storage read
#        (scripts/ci/e2eCloud.ts)
#   offline  N-1 -> N signed in (deep), then N's network blocked for its own processes only (Linux: a group and an
#        iptables owner rule; macOS: a group and a pf anchor; Windows: firewall rules on Filen.exe and rclone.exe): how
#        long until its pairs are offline, an edit made meanwhile, how long until it uploads once the block is lifted.
#        Reported as information (scripts/ci/e2e/spikes/offline.ts); one 4.x sign-in per entry
#   keyring-mac  macOS arm64, signed: a dedicated keychain locked as N first starts over chain K's synthetic 3.x
#        profile; what safeStorage does (a prompt, a rejection, or no encryption), with the prompt cancelled and the
#        keychain unlocked from outside, as information (scripts/ci/e2e/spikes/keyringMac.ts); no sign-in
#
# Secrets: CSC_LINK, CSC_KEY_PASSWORD (Developer ID); AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Windows
# signing); FILEN_DESKTOP_E2E_TEST_EMAIL, FILEN_DESKTOP_E2E_TEST_PASSWORD (a dedicated account without 2FA; deep
# entries, s7 and cloud, in the steps that sign in or reach the cloud only); FILEN_DESKTOP_E2E_QUOTA_EMAIL,
# FILEN_DESKTOP_E2E_QUOTA_PASSWORD (a second account whose storage is kept full; optional, its slot is skipped without
# them); FILEN_DESKTOP_E2E_SESSION_KEY (the organization's secret the cached and handed sessions are sealed under).
name: Desktop E2E

on:
  workflow_call:
    inputs:
      candidate-from-run:
        description: Test the desktop-{mac,windows,linux} artifacts this run already built instead of building N here
        type: boolean
        default: false
      signed:
        description: Sign N-1 (and N, when built here) with the release identities
        type: boolean
        default: true
      platforms:
        description: Comma-separated subset of windows,mac,linux
        type: string
        default: windows,mac,linux
      legacy:
        description: Also test the updates from 3.0.53 (and 3.0.47, scripts/ci/olderPlan.ts)
        type: boolean
        default: true
      profile:
        description: release, nightly or custom (scripts/ci/e2ePlan.ts)
        type: string
        default: release
      scenarios:
        description: Comma-separated subset of previous,legacy,update-kill,keyring (a release runs update-kill always)
        type: string
        default: previous,legacy
      formats:
        description: Custom profile only, e.g. win-x64-nsis,linux-x64-deb (all when empty)
        type: string
        default: ''
      depth:
        description: auto (the profile's deep entries), install or deep
        type: string
        default: auto
  workflow_dispatch:
    inputs:
      signed:
        description: Sign the builds with the release identities (needed for macOS)
        type: boolean
        default: false
      platforms:
        description: Comma-separated subset of windows,mac,linux
        type: string
        default: windows,mac,linux
      legacy:
        description: Also test the updates from 3.0.53 (and 3.0.47, scripts/ci/olderPlan.ts)
        type: boolean
        default: true
      profile:
        description: custom and release follow `signed`; nightly signs macOS only, as the scheduled run does
        type: choice
        options:
          - custom
          - nightly
          - release
        default: custom
      scenarios:
        description: Comma-separated subset of previous,legacy,older,update-kill,keyring (older is 3.0.47 -> N, by hand only when named; a release runs update-kill always)
        type: string
        default: previous,legacy
      formats:
        description: Custom profile only, e.g. win-x64-nsis,linux-x64-deb (all when empty)
        type: string
        default: ''
      depth:
        description: auto takes the profile's deep entries; install signs nothing in
        type: choice
        options:
          - auto
          - install
          - deep
        default: auto
      spike:
        description: Run a spike instead of the update scenarios
        type: choice
        options:
          - none
          - s1
          - s7
          - cloud
          - offline
          - keyring-mac
        default: none
      signin:
        description: Custom profile only. auto signs in through a form once per OS and chain and seeds the rest; real signs in every deep chain
        type: choice
        options:
          - auto
          - real
        default: auto
      scale_reseed:
        description: Write a new generation of the permanent scale tree and its manifest before the tests (session job), then check it; refused while another run is active
        type: boolean
        default: false
      names_check:
        description: Chain P's names pair (needs the sdk-rs release with the names fixes)
        type: boolean
        default: false
  # Every night on main: every entry the release tests, on builds made here.
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: read

# A group keeps one pending run and a newer one replaces it, so no run shares a group it could be replaced in: the
# nightly has its own (one a day), every dispatch its own run's, and a release (called from another workflow, whose
# name github.workflow then is) its own. Runs may overlap; the login budget (90 an hour per IP, a run costing at most
# MAX_LOGINS_PER_RUN, 10) is kept by the plan job, which refuses a dispatch while MAX_OTHER_RUNS others are active
# (never the nightly).
concurrency:
  group: desktop-e2e-${{ github.workflow != 'Desktop E2E' && 'release' || github.event_name == 'schedule' && 'nightly' || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading this workflow's other runs (the login budget guard).
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: packages/filen-desktop
    outputs:
      spike: ${{ steps.plan.outputs.spike }}
      session: ${{ steps.plan.outputs.session }}
      logins: ${{ steps.plan.outputs.logins }}
      pins: ${{ steps.plan.outputs.pins }}
      next-version: ${{ steps.plan.outputs.next-version }}
      prev-version: ${{ steps.plan.outputs.prev-version }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      test-matrix: ${{ steps.plan.outputs.test-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: packages/filen-desktop
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # No pnpm in this job; the root packageManager field would otherwise turn on a pnpm cache.
          package-manager-cache: false
      # Inputs reach the planner through the environment only; it validates every value. A scheduled run has none.
      - name: Plan
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SIGNED: ${{ inputs.signed }}
          PROFILE: ${{ inputs.profile }}
          SCENARIOS: ${{ inputs.scenarios }}
          LEGACY: ${{ inputs.legacy }}
          FORMATS: ${{ inputs.formats }}
          DEPTH: ${{ inputs.depth }}
          SPIKE: ${{ inputs.spike }}
          SIGNIN: ${{ inputs.signin }}
        run: node scripts/ci/e2ePlan.ts
      # Worst case with MAX_OTHER_RUNS others: this run, four other dispatches, the nightly and a release at 10 logins
      # each, 70 an hour, under the 90 even if every runner shared one IP (each has its own). A scheduled run is never
      # refused; a release is not counted here.
      - name: Keep overlapping runs within the login budget
        if: steps.plan.outputs.session == 'true' && github.workflow == 'Desktop E2E' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_OTHER_RUNS: 5
          LOGINS: ${{ steps.plan.outputs.logins }}
        run: |
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow desktop-e2e.yml --limit 50 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID})] | length")"
          echo "other active Desktop E2E runs: ${active}; this run logs in at most ${LOGINS} times"
          if [ "${active}" -ge "${MAX_OTHER_RUNS}" ]; then
            echo "::error::${active} other Desktop E2E runs are active; dispatch again once one finishes (the account allows 90 logins an hour)"
            exit 1
          fi
      # A reseed removes the scale tree's generations older than the one it replaces (scripts/ci/e2e/scaleTree.ts), so
      # it runs alone: no other run may be reading one of them, nor reseeding at the same time.
      - name: Run a scale reseed alone
        if: inputs.scale_reseed && github.workflow == 'Desktop E2E'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow desktop-e2e.yml --limit 50 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId != ${GITHUB_RUN_ID})] | length")"
          if [ "${active}" -gt 0 ]; then
            echo "::error::${active} other Desktop E2E runs are active; dispatch scale_reseed again once none is"
            exit 1
          fi

  # The run's sessions, one per account slot (scripts/ci/e2e/session.ts): the cached one when the API still knows it and
  # it is under a week old, else exactly one login (sdk-rs), never retried; an unreachable API fails the job without a
  # login. Cache and hand-off are sealed under keys from FILEN_DESKTOP_E2E_SESSION_KEY. A slot's step outputs only
  # whether it minted, which saves the new copy to the cache (each run attempt under its own key: a key, once saved, is
  # never overwritten; the newest is restored by prefix). The hand-off goes on as files in a one-day artifact that the
  # sweep deletes: never as a job output or an environment variable, which GitHub prints with a step's settings. A
  # failure fails the deep jobs and the sweep is skipped.
  session:
    needs: plan
    if: needs.plan.outputs.session == 'true'
    runs-on: ubuntu-latest
    # `dropped` when the account's auth version is one 3.0.47 cannot sign in to: its signed-in chain gives way to its
    # install-only update. Nothing else leaves this job.
    outputs:
      older: ${{ steps.pins.outputs.older }}
    # A reseed uploads about 8,500 entries.
    timeout-minutes: ${{ inputs.scale_reseed && 60 || 25 }}
    defaults:
      run:
        working-directory: packages/filen-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install the harness dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile --filter "@filen/desktop..." --ignore-scripts
      - name: Restore the cached test session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/e2e-cache/test.sealed
          key: desktop-e2e-session-v1-test-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desktop-e2e-session-v1-test-
      - name: The test session
        id: test
        timeout-minutes: 5
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_CACHE_DIR: ${{ runner.temp }}/e2e-cache
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts session --slot test
      - name: Cache the new test session
        if: steps.test.outputs.minted == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/e2e-cache/test.sealed
          key: desktop-e2e-session-v1-test-${{ github.run_id }}-${{ github.run_attempt }}
      # Before any old client is signed in or seeded: the account's auth version is one each of them can sign in to
      # (3.0.47's SDK takes v1 and v2 only). Reads the hand-off just written; no login, no request. An account 3.0.47
      # cannot take drops its signed-in chain only, with a notice (output `older`); the rest of the run goes on.
      - name: Check the test account against the old clients
        id: pins
        if: needs.plan.outputs.pins != ''
        timeout-minutes: 2
        env:
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
          E2E_SIGN_IN_PINS: ${{ needs.plan.outputs.pins }}
        run: node scripts/ci/e2eCloud.ts pins
      - name: Restore the cached quota session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/e2e-cache/quota.sealed
          key: desktop-e2e-session-v1-quota-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desktop-e2e-session-v1-quota-
      # Skipped by the script (minted=false, no hand-off) while the quota account's secrets are not set.
      - name: The quota session
        id: quota
        timeout-minutes: 5
        env:
          FILEN_DESKTOP_E2E_QUOTA_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_QUOTA_EMAIL }}
          FILEN_DESKTOP_E2E_QUOTA_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_QUOTA_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_CACHE_DIR: ${{ runner.temp }}/e2e-cache
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts session --slot quota
      - name: Cache the new quota session
        if: steps.quota.outputs.minted == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/e2e-cache/quota.sealed
          key: desktop-e2e-session-v1-quota-${{ github.run_id }}-${{ github.run_attempt }}
      # Once a run, before the tests: the scale tree against its manifest (a new generation with scale_reseed). A broken tree
      # fails chain P's scale checks by name, never the other deep jobs, so this step does not fail the job.
      - name: The scale fixture tree
        continue-on-error: true
        timeout-minutes: ${{ inputs.scale_reseed && 45 || 8 }}
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts fixtures ${{ inputs.scale_reseed && '--reseed' || '' }}
      - name: Hand the sealed sessions on
        uses: actions/upload-artifact@v6
        with:
          name: desktop-e2e-session
          path: ${{ runner.temp }}/e2e-session
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Spike cloud: the harness's cloud side on its own.
  cloud:
    name: cloud self-test
    needs: [plan, session]
    if: ${{ !cancelled() && needs.plan.outputs.spike == 'cloud' && needs.session.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/filen-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install the harness dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile --filter "@filen/desktop..." --ignore-scripts
      # The sealed sessions as files (never an environment variable or a job output, which are printed with a step's
      # settings); the harness masks them on reading.
      - name: Download the sealed session
        uses: actions/download-artifact@v7
        with:
          name: desktop-e2e-session
          path: ${{ runner.temp }}/e2e-session
      - name: Cloud self-test
        timeout-minutes: 15
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts selftest --artifacts e2e-artifacts
      - name: Upload the self-test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desktop-e2e-cloud-${{ github.run_attempt }}
          path: packages/filen-desktop/e2e-artifacts
          if-no-files-found: warn
          retention-days: 14

  # Only when N is built here; the release hands over its own web build.
  web:
    needs: plan
    if: ${{ !inputs.candidate-from-run && needs.plan.outputs.spike != 'cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache spellcheck dictionaries
        uses: actions/cache@v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: packages/filen-web/dist
          if-no-files-found: error
          retention-days: 1

  # N-1 (not for spikes but offline); N too unless the caller built it. One job per OS builds both architectures, as the release
  # does. Whether an OS's builds are signed comes from the plan.
  build:
    needs: [plan, web]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.spike != 'cloud' && (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: packages/filen-desktop
    env:
      PREV_VERSION: ${{ needs.plan.outputs.prev-version }}
      # Unsigned builds must not pick up any identity a runner might hold.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.sign && 'true' || 'false' }}
      # The builder config signs on Windows only with all three account values (not secrets).
      AZURE_SIGNING_ENDPOINT: ${{ matrix.sign && 'https://weu.codesigning.azure.net' || '' }}
      AZURE_SIGNING_ACCOUNT: ${{ matrix.sign && 'filen-signing' || '' }}
      AZURE_SIGNING_PROFILE: ${{ matrix.sign && 'filen-signing' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # The File Provider extension's sources: only the desktop's two submodules, not the mobile ones.
      - name: Check out the File Provider submodules
        if: matrix.os == 'mac'
        id: submodules
        working-directory: .
        run: |
          git submodule update --init --depth 1 -- packages/filen-desktop/filen-ios-file-provider packages/filen-desktop/filen-rs
          echo "filen-rs=$(git rev-parse HEAD:packages/filen-desktop/filen-rs)" >> "${GITHUB_OUTPUT}"
      - name: Set up Xcode
        if: matrix.os == 'mac'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.5'
      # The toolchain filen-rs pins in rust-toolchain.toml, plus both macOS targets of the universal extension.
      - name: Set up Rust
        if: matrix.os == 'mac'
        working-directory: packages/filen-desktop/filen-rs
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # Same key as the release's mac job, so a release's e2e run reuses its build.
      - name: Cache Cargo
        if: matrix.os == 'mac'
        uses: actions/cache@v4
        with:
          # Third-party crates only: filen-rs's own crates rebuild anyway (a fresh checkout is newer than their
          # fingerprints), and target/macos is regenerated on every build.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-desktop/filen-rs/target
            !packages/filen-desktop/filen-rs/target/macos
            !packages/filen-desktop/filen-rs/target/**/libfilen_*
          key: fp-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-desktop/filen-rs/rust-toolchain.toml') }}-${{ steps.submodules.outputs.filen-rs }}
          restore-keys: fp-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-desktop/filen-rs/rust-toolchain.toml') }}-
      - name: Install rpm
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends rpm
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/desktop...
      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: packages/filen-web/dist
      # Once for both N and N-1: sets FILEN_DESKTOP_FP_APPEX, which every dist below packages.
      - name: Build the File Provider extension
        if: matrix.os == 'mac'
        env:
          CARGO_INCREMENTAL: 0
        run: node scripts/buildFileProvider.ts
      - name: Verify signing secrets are set
        if: matrix.sign
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          case "${{ matrix.os }}" in
            mac) names="CSC_LINK CSC_KEY_PASSWORD" ;;
            windows) names="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET" ;;
            *) names="" ;;
          esac
          missing=0
          for name in ${names}; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret ${name} is not set; a signed e2e run cannot run without it."
              missing=1
            fi
          done
          exit "${missing}"
      # The formats a user installs (and, for N, the update payloads the feed serves). Notarization is off explicitly:
      # nothing in these tests is quarantined, and the release job notarizes and checks its own builds.
      - name: Choose targets
        run: |
          case "${{ matrix.os }}" in
            mac) echo "PREV_TARGETS=--mac dmg --x64 --arm64 -c.mac.notarize=false" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--mac dmg zip --x64 --arm64 -c.mac.notarize=false" >> "${GITHUB_ENV}" ;;
            windows) echo "PREV_TARGETS=--win nsis --x64 --arm64" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--win nsis --x64 --arm64" >> "${GITHUB_ENV}" ;;
            linux) echo "PREV_TARGETS=--linux deb rpm AppImage --x64 --arm64" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--linux deb rpm AppImage --x64 --arm64" >> "${GITHUB_ENV}" ;;
          esac
      - name: Build N
        if: ${{ !inputs.candidate-from-run }}
        env:
          CSC_LINK: ${{ matrix.sign && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.sign && secrets.CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.sign && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.sign && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.sign && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          read -ra targets <<< "${NEXT_TARGETS}"
          pnpm run dist -- "${targets[@]}"
      - name: Build N-1
        if: needs.plan.outputs.spike == '' || needs.plan.outputs.spike == 'offline'
        env:
          CSC_LINK: ${{ matrix.sign && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.sign && secrets.CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ matrix.sign && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.sign && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.sign && secrets.AZURE_CLIENT_SECRET || '' }}
        # Same commit, lower version: package.json's version in the app (and so app.getVersion(), the installer and
        # the bundle versions) comes from extraMetadata.
        run: |
          read -ra targets <<< "${PREV_TARGETS}"
          pnpm run dist -- "${targets[@]}" "-c.extraMetadata.version=${PREV_VERSION}" -c.directories.output=release-prev
      - name: Upload N
        if: ${{ !inputs.candidate-from-run }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/filen-desktop/release/*.exe
            packages/filen-desktop/release/*.dmg
            packages/filen-desktop/release/*.zip
            packages/filen-desktop/release/*.deb
            packages/filen-desktop/release/*.rpm
            packages/filen-desktop/release/*.AppImage
            packages/filen-desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload N-1
        if: needs.plan.outputs.spike == '' || needs.plan.outputs.spike == 'offline'
        uses: actions/upload-artifact@v6
        with:
          name: e2e-prev-${{ matrix.os }}
          path: |
            packages/filen-desktop/release-prev/*.exe
            packages/filen-desktop/release-prev/*.dmg
            packages/filen-desktop/release-prev/*.deb
            packages/filen-desktop/release-prev/*.rpm
            packages/filen-desktop/release-prev/*.AppImage
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  test:
    name: ${{ matrix.spike && format('{0} ', matrix.spike) || '' }}${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.format }}${{ matrix.deep && ' deep' || '' }}${{ matrix.lane && format(' {0}', matrix.lane) || '' }}
    needs: [plan, build, session]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.session.result == 'success' || needs.session.result == 'skipped') }}
    # Deep entries share the e2e account. P11's listing drop holds its drive-write lock (every client of the account
    # waits to write meanwhile, up to 150 s), so P11 runs in turn across entries and overlapping runs (an entry may
    # wait up to 40 min for it); checks outside P11 can meet that hold (scripts/ci/e2e/chains/offlineListing.ts).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    # Setup and every step the job can run at its timeout (scripts/ci/e2ePlan.ts jobMinutes, STEP_MINUTES). Where an
    # entry's chains overrun the six hours a hosted runner allows, its 3.0.47 chain and chain K run in a second job
    # (matrix.lane).
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: packages/filen-desktop
    env:
      TEST_ARGS: >-
        --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --format ${{ matrix.format }}
        --next release --next-version ${{ needs.plan.outputs.next-version }}
        --prev release-prev --prev-version ${{ needs.plan.outputs.prev-version }}
        ${{ matrix.signed && '--signed' || '' }}
      FEDORA_IMAGE: registry.fedoraproject.org/fedora:42
    steps:
      # The update scenarios at install depth need Node built-ins only; deep entries and spikes also install the
      # package's dependencies (playwright-core, the sdk-rs addon, rclone's pinned download).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: ${{ !matrix.spike && !matrix.deep && 'packages/filen-desktop' || '' }}
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Set up pnpm
        if: matrix.spike || matrix.deep
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # With its workspace dependencies' own: chain L reads the old client's storage keys from the app's sources.
      - name: Install the harness dependencies
        if: matrix.spike || matrix.deep
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile --filter "@filen/desktop..." --ignore-scripts
      - name: Download the sealed session
        if: matrix.deepPrevious || matrix.deepLegacy || matrix.deepOlder
        uses: actions/download-artifact@v7
        with:
          name: desktop-e2e-session
          path: ${{ runner.temp }}/e2e-session
      - name: Download N
        uses: actions/download-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: packages/filen-desktop/release
      - name: Download N-1
        if: ${{ !matrix.spike || matrix.deepPrevious }}
        uses: actions/download-artifact@v7
        with:
          name: e2e-prev-${{ matrix.os }}
          path: packages/filen-desktop/release-prev
      - name: Prepare the Linux desktop
        if: matrix.os == 'linux' && matrix.format != 'rpm'
        env:
          # Deep: a secret service for the session vault, the X tools that drive and record the folder chooser, FUSE
          # for the drive, gdb for a crash's core dump.
          DEEP_PACKAGES: ${{ matrix.deep && 'gnome-keyring libsecret-tools dbus-daemon xdotool x11-apps fuse3 gdb' || '' }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install --yes --no-install-recommends xvfb ${DEEP_PACKAGES}
          # electron-updater asks for root through the first of these it finds, and none can prompt without a desktop
          # session. Hidden, it falls back to sudo (passwordless here) and still takes its non-root install path.
          for prompt in gksudo kdesudo pkexec beesu; do
            while found="$(command -v "${prompt}")"; do
              sudo mv "${found}" "${found}.e2e-hidden"
              hash -r
            done
          done
      # AppImages carry no AppArmor profile, so on Ubuntu 24.04 Chromium's sandbox needs unprivileged user namespaces.
      # The relaunch after the update runs without --no-sandbox, as a user's does. (The deb installs its own profile.)
      - name: Allow unprivileged user namespaces
        if: matrix.format == 'AppImage'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # No RPM-based runners exist: the rpm runs as root in a Fedora container of the runner's architecture, with the
      # runner's Node mounted in. GITHUB_ACTIONS goes in too, for the scripts' disposable-machine guard.
      - name: Pull Fedora
        if: matrix.format == 'rpm'
        run: docker pull "${FEDORA_IMAGE}"
      - name: N-1 -> N
        if: matrix.previous && !matrix.deepPrevious && matrix.format != 'rpm'
        run: node scripts/ci/e2e.ts --scenario previous ${{ env.TEST_ARGS }}
      # In the desktop session the chain needs (scripts/ci/deepSession.sh: on Linux one D-Bus session with an unlocked
      # gnome-keyring for every launch of the chain); bash is Git Bash on Windows.
      - name: N-1 -> N, signed in
        if: matrix.deepPrevious
        shell: bash
        timeout-minutes: 165
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
          # The cloud-storage-full check (matrix.quota, one entry): its one form sign-in on the quota account. The
          # harness takes both out of its environment before anything starts, and skips the check without them.
          FILEN_DESKTOP_E2E_QUOTA_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_QUOTA_EMAIL }}
          FILEN_DESKTOP_E2E_QUOTA_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_QUOTA_PASSWORD }}
          E2E_QUOTA: ${{ matrix.quota && '1' || '' }}
          E2E_SIGN_IN: ${{ matrix.signInPrevious }}
          E2E_STAGGER_SECONDS: ${{ matrix.stagger }}
          # Below the step's timeout: a chain that overruns writes its evidence and fails by name.
          E2E_CHAIN_BUDGET_MINUTES: 150
          E2E_OFFLINE_SPIKE: ${{ matrix.spike == 'offline' && '1' || '' }}
          E2E_NAMES_CHECK: ${{ inputs.names_check && '1' || '' }}
        run: bash scripts/ci/deepSession.sh --scenario previous --depth deep ${{ env.TEST_ARGS }} --artifacts e2e-artifacts
      - name: N-1 -> N (Fedora container)
        if: matrix.previous && matrix.format == 'rpm'
        run: >-
          docker run --rm --shm-size=2g -e GITHUB_ACTIONS
          -v "${GITHUB_WORKSPACE}:/work" -v "$(dirname "$(command -v node)"):/opt/host-node:ro"
          -w /work/packages/filen-desktop "${FEDORA_IMAGE}"
          bash -ec 'dnf install --assumeyes --quiet xorg-x11-server-Xvfb && /opt/host-node/node scripts/ci/e2e.ts "$@"'
          e2e --scenario previous ${{ env.TEST_ARGS }}
      - name: 3.0.53 -> N
        if: ${{ !cancelled() && matrix.legacy && !matrix.deepLegacy && matrix.format != 'rpm' }}
        run: node scripts/ci/e2e.ts --scenario legacy ${{ env.TEST_ARGS }}
      - name: 3.0.53 -> N, signed in
        if: ${{ !cancelled() && matrix.deepLegacy }}
        shell: bash
        timeout-minutes: 120
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
          E2E_SIGN_IN: ${{ matrix.signInLegacy }}
          E2E_STAGGER_SECONDS: ${{ matrix.stagger }}
          E2E_CHAIN_BUDGET_MINUTES: 105
        run: bash scripts/ci/deepSession.sh --scenario legacy --depth deep ${{ env.TEST_ARGS }} --artifacts e2e-artifacts
      - name: 3.0.53 -> N (Fedora container)
        if: ${{ !cancelled() && matrix.legacy && matrix.format == 'rpm' }}
        run: >-
          docker run --rm --shm-size=2g -e GITHUB_ACTIONS
          -v "${GITHUB_WORKSPACE}:/work" -v "$(dirname "$(command -v node)"):/opt/host-node:ro"
          -w /work/packages/filen-desktop "${FEDORA_IMAGE}"
          bash -ec 'dnf install --assumeyes --quiet xorg-x11-server-Xvfb && /opt/host-node/node scripts/ci/e2e.ts "$@"'
          e2e --scenario legacy ${{ env.TEST_ARGS }}
      # 3.0.47 (scripts/ci/olderPlan.ts): its update launch is hooked through its inspector; on Linux its updater gets a
      # pkexec of its own (scripts/ci/e2e/olderUpdate.ts), the real prompts staying hidden.
      # Also where the account's auth version dropped the signed-in chain (job `session`, output `older`).
      - name: 3.0.47 -> N
        if: ${{ !cancelled() && matrix.older && (!matrix.deepOlder || needs.session.outputs.older == 'dropped') }}
        timeout-minutes: 30
        run: node scripts/ci/e2e.ts --scenario older ${{ env.TEST_ARGS }}
      - name: 3.0.47 -> N, signed in
        if: ${{ !cancelled() && matrix.deepOlder && needs.session.outputs.older != 'dropped' }}
        shell: bash
        timeout-minutes: 120
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
          E2E_SIGN_IN: ${{ matrix.signInOlder }}
          E2E_STAGGER_SECONDS: ${{ matrix.stagger }}
          E2E_CHAIN_BUDGET_MINUTES: 105
        run: bash scripts/ci/deepSession.sh --scenario older --depth deep ${{ env.TEST_ARGS }} --artifacts e2e-artifacts
      # Every release run, and by hand when `scenarios` names update-kill: N-1's update installer killed mid-install
      # (Windows installer, ShipIt, dpkg; on the AppImage a failing mv), then what a user is left with must work
      # (scripts/ci/e2e/updateKill.ts). Install depth, nothing signed in, not for rpm.
      - name: N-1 -> N, installer killed
        if: ${{ !cancelled() && matrix.updateKill }}
        timeout-minutes: 45
        run: node scripts/ci/e2e.ts --scenario update-kill ${{ env.TEST_ARGS }}
      # Chain K starts its own D-Bus sessions and talks to them with dbus-send. After chain L, whose 3.0.53 download it
      # reuses where the two share a job (matrix.lane); it signs nothing in, so it gets no secret.
      - name: Prepare the keyring chain
        if: ${{ !cancelled() && matrix.keyring }}
        run: sudo apt-get install --yes --no-install-recommends dbus-bin dbus-daemon gnome-keyring libsecret-tools
      - name: Keyring chain K, no sign-in
        if: ${{ !cancelled() && matrix.keyring }}
        timeout-minutes: 45
        env:
          E2E_CHAIN_BUDGET_MINUTES: 40
        run: node scripts/ci/e2e.ts --scenario keyring ${{ env.TEST_ARGS }} --artifacts e2e-artifacts
      # The account's credentials reach spike s7 only, and only this step (deep entries: the step above).
      # Bounded so a hang never holds a runner for the job's whole budget.
      - name: Spike ${{ matrix.spike }}
        if: matrix.spike && !matrix.deep
        timeout-minutes: 20
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ matrix.spike == 's7' && secrets.FILEN_DESKTOP_E2E_TEST_EMAIL || '' }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ matrix.spike == 's7' && secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD || '' }}
        run: node scripts/ci/e2e.ts --scenario spike-${{ matrix.spike }} ${{ env.TEST_ARGS }} --artifacts e2e-artifacts
      # The harness redacts the account's credentials and every secret it holds from everything it writes there.
      - name: Upload evidence
        if: ${{ always() && (matrix.spike || matrix.deep) }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-e2e-${{ matrix.spike && format('spike-{0}', matrix.spike) || 'deep' }}-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.format }}${{ matrix.lane && format('-{0}', matrix.lane) || '' }}-${{ github.run_attempt }}
          path: packages/filen-desktop/e2e-artifacts
          if-no-files-found: warn
          retention-days: 14

  # Whatever happened: this run's cloud directories (every attempt) and any older than a day, then the trash. The cached
  # session stays: a sign-out never revokes its key, so there is nothing to undo.
  sweep:
    needs: [plan, session, cloud, test]
    if: ${{ always() && needs.session.result == 'success' }}
    runs-on: ubuntu-latest
    # Deleting the sealed session's artifact.
    permissions:
      contents: read
      actions: write
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/filen-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install the harness dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: pnpm install --frozen-lockfile --filter "@filen/desktop..." --ignore-scripts
      - name: Download the sealed session
        uses: actions/download-artifact@v7
        with:
          name: desktop-e2e-session
          path: ${{ runner.temp }}/e2e-session
      - name: Sweep the run's cloud directories
        timeout-minutes: 8
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts sweep
      # The second of the run's two checks of the scale tree: nothing in the run changed it. Unseeded is a warning.
      - name: Check the scale fixture tree
        timeout-minutes: 8
        env:
          FILEN_DESKTOP_E2E_TEST_EMAIL: ${{ secrets.FILEN_DESKTOP_E2E_TEST_EMAIL }}
          FILEN_DESKTOP_E2E_TEST_PASSWORD: ${{ secrets.FILEN_DESKTOP_E2E_TEST_PASSWORD }}
          FILEN_DESKTOP_E2E_SESSION_KEY: ${{ secrets.FILEN_DESKTOP_E2E_SESSION_KEY }}
          FILEN_DESKTOP_E2E_SESSION_DIR: ${{ runner.temp }}/e2e-session
        run: node scripts/ci/e2eCloud.ts fixtures
      # The sealed session is not kept past the run.
      - name: Delete the sealed session
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name == "desktop-e2e-session") | .id')"
          for id in ${ids}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
          done
