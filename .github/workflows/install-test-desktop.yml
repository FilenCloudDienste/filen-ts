# Real-install tests of filen-desktop (PLAN §9, blocking for 4.0.0). On a runner of every platform and architecture
# that ships, each install format is installed the way a user installs it, launched, and updated by the app's own
# updater from a feed on the loopback interface that serves the candidate build N. The test then requires the app to
# relaunch at N from the same install location, with the same userData and a marker file in it intact
# (packages/filen-desktop/scripts/ci/installTest.ts). N must ship the pinned rclone for the runner's CPU, runnable from
# the install, and on Windows every install (and the update) must leave WinFsp installed; the test removes WinFsp
# between installs so that each installer has to bring it.
#
#   N-1 -> N      N-1 is the same commit built with a lower version, so the new updater, installer and uninstaller
#                 run against each other.
#   3.0.53 -> N   the real last 3.x release, downloaded from the old repository's GitHub release and checked against
#                 pinned hashes: the path the whole installed fleet takes to 4.x. It is its old updater and its old
#                 NSIS uninstaller (run with --updated, which is what keeps %APPDATA%\@filen\desktop) that do the work.
#
# Called by release-desktop.yml before anything is published, on the signed artifacts it built (candidate-from-run).
# Run by hand, it builds N itself; unsigned is the default there, and macOS is then left out: Squirrel.Mac installs an
# update only if it satisfies the running app's designated requirement (Developer ID, Team 7YTW5D2K7P), which ad-hoc
# signed builds never do.
name: Install test desktop

on:
  workflow_call:
    inputs:
      candidate-from-run:
        description: Test the desktop-{mac,windows,linux} artifacts this run already built instead of building N here
        type: boolean
        default: false
      signed:
        description: Sign N-1 (and N, when built here) with the release identities
        type: boolean
        default: true
      platforms:
        description: Comma-separated subset of windows,mac,linux
        type: string
        default: windows,mac,linux
      legacy:
        description: Also test the update from 3.0.53
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      signed:
        description: Sign the builds with the release identities (needed for macOS)
        type: boolean
        default: false
      platforms:
        description: Comma-separated subset of windows,mac,linux
        type: string
        default: windows,mac,linux
      legacy:
        description: Also test the update from 3.0.53
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/filen-desktop
    outputs:
      next-version: ${{ steps.plan.outputs.next-version }}
      prev-version: ${{ steps.plan.outputs.prev-version }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      test-matrix: ${{ steps.plan.outputs.test-matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: packages/filen-desktop
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Plan
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
          SIGNED: ${{ inputs.signed }}
        run: node scripts/ci/installTestPlan.ts

  # Only when N is built here; the release hands over its own web build.
  web:
    needs: plan
    if: ${{ !inputs.candidate-from-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache spellcheck dictionaries
        uses: actions/cache@v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: packages/filen-web/dist
          if-no-files-found: error
          retention-days: 1

  # N-1 always; N too unless the caller built it. One job per OS builds both architectures, as the release does.
  build:
    needs: [plan, web]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.web.result == 'success' || needs.web.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: packages/filen-desktop
    env:
      PREV_VERSION: ${{ needs.plan.outputs.prev-version }}
      # Unsigned runs must not pick up any identity a runner might hold.
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.signed && 'true' || 'false' }}
      # The builder config signs on Windows only with all three account values (not secrets).
      AZURE_SIGNING_ENDPOINT: ${{ inputs.signed && 'https://weu.codesigning.azure.net' || '' }}
      AZURE_SIGNING_ACCOUNT: ${{ inputs.signed && 'filen-signing' || '' }}
      AZURE_SIGNING_PROFILE: ${{ inputs.signed && 'filen-signing' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Xcode
        if: matrix.os == 'mac'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.5'
      - name: Install rpm
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends rpm
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/desktop...
      - name: Download web build
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: packages/filen-web/dist
      - name: Verify signing secrets are set
        if: inputs.signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          case "${{ matrix.os }}" in
            mac) names="CSC_LINK CSC_KEY_PASSWORD" ;;
            windows) names="AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET" ;;
            *) names="" ;;
          esac
          missing=0
          for name in ${names}; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret ${name} is not set; a signed install test cannot run without it."
              missing=1
            fi
          done
          exit "${missing}"
      # The formats a user installs (and, for N, the update payloads the feed serves). Notarization is skipped (no
      # Apple ID here): nothing in these tests is quarantined, and the release job checks notarization itself.
      - name: Choose targets
        run: |
          case "${{ matrix.os }}" in
            mac) echo "PREV_TARGETS=--mac dmg --x64 --arm64" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--mac dmg zip --x64 --arm64" >> "${GITHUB_ENV}" ;;
            windows) echo "PREV_TARGETS=--win nsis --x64 --arm64" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--win nsis --x64 --arm64" >> "${GITHUB_ENV}" ;;
            linux) echo "PREV_TARGETS=--linux deb rpm AppImage --x64 --arm64" >> "${GITHUB_ENV}"; echo "NEXT_TARGETS=--linux deb rpm AppImage --x64 --arm64" >> "${GITHUB_ENV}" ;;
          esac
      - name: Build N
        if: ${{ !inputs.candidate-from-run }}
        env:
          CSC_LINK: ${{ inputs.signed && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ inputs.signed && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.signed && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.signed && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          read -ra targets <<< "${NEXT_TARGETS}"
          pnpm run dist -- "${targets[@]}"
      - name: Build N-1
        env:
          CSC_LINK: ${{ inputs.signed && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.CSC_KEY_PASSWORD || '' }}
          AZURE_TENANT_ID: ${{ inputs.signed && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ inputs.signed && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ inputs.signed && secrets.AZURE_CLIENT_SECRET || '' }}
        # Same commit, lower version: package.json's version in the app (and so app.getVersion(), the installer and
        # the bundle versions) comes from extraMetadata.
        run: |
          read -ra targets <<< "${PREV_TARGETS}"
          pnpm run dist -- "${targets[@]}" "-c.extraMetadata.version=${PREV_VERSION}" -c.directories.output=release-prev
      - name: Upload N
        if: ${{ !inputs.candidate-from-run }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/filen-desktop/release/*.exe
            packages/filen-desktop/release/*.dmg
            packages/filen-desktop/release/*.zip
            packages/filen-desktop/release/*.deb
            packages/filen-desktop/release/*.rpm
            packages/filen-desktop/release/*.AppImage
            packages/filen-desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload N-1
        uses: actions/upload-artifact@v6
        with:
          name: installtest-prev-${{ matrix.os }}
          path: |
            packages/filen-desktop/release-prev/*.exe
            packages/filen-desktop/release-prev/*.dmg
            packages/filen-desktop/release-prev/*.deb
            packages/filen-desktop/release-prev/*.rpm
            packages/filen-desktop/release-prev/*.AppImage
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  test:
    name: ${{ matrix.platform }} ${{ matrix.arch }} ${{ matrix.format }}
    needs: [plan, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/filen-desktop
    env:
      TEST_ARGS: >-
        --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --format ${{ matrix.format }}
        --next release --next-version ${{ needs.plan.outputs.next-version }}
        --prev release-prev --prev-version ${{ needs.plan.outputs.prev-version }}
        ${{ inputs.signed && '--signed' || '' }}
      FEDORA_IMAGE: registry.fedoraproject.org/fedora:42
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          sparse-checkout: packages/filen-desktop
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Download N
        uses: actions/download-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: packages/filen-desktop/release
      - name: Download N-1
        uses: actions/download-artifact@v7
        with:
          name: installtest-prev-${{ matrix.os }}
          path: packages/filen-desktop/release-prev
      - name: Prepare the Linux desktop
        if: matrix.os == 'linux' && matrix.format != 'rpm'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb
          # electron-updater asks for root through the first of these it finds, and none can prompt without a desktop
          # session. Hidden, it falls back to sudo (passwordless here) and still takes its non-root install path.
          for prompt in gksudo kdesudo pkexec beesu; do
            while found="$(command -v "${prompt}")"; do
              sudo mv "${found}" "${found}.install-test-hidden"
              hash -r
            done
          done
      # AppImages carry no AppArmor profile, so on Ubuntu 24.04 Chromium's sandbox needs unprivileged user namespaces.
      # The relaunch after the update runs without --no-sandbox, as a user's does. (The deb installs its own profile.)
      - name: Allow unprivileged user namespaces
        if: matrix.format == 'AppImage'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # No RPM-based runners exist: the rpm runs as root in a Fedora container of the runner's architecture, with the
      # runner's Node mounted in.
      - name: Pull Fedora
        if: matrix.format == 'rpm'
        run: docker pull "${FEDORA_IMAGE}"
      - name: N-1 -> N
        if: matrix.format != 'rpm'
        run: node scripts/ci/installTest.ts --scenario previous ${{ env.TEST_ARGS }}
      - name: N-1 -> N (Fedora container)
        if: matrix.format == 'rpm'
        run: >-
          docker run --rm --shm-size=2g
          -v "${GITHUB_WORKSPACE}:/work" -v "$(dirname "$(command -v node)"):/opt/host-node:ro"
          -w /work/packages/filen-desktop "${FEDORA_IMAGE}"
          bash -ec 'dnf install --assumeyes --quiet xorg-x11-server-Xvfb && /opt/host-node/node scripts/ci/installTest.ts "$@"'
          install-test --scenario previous ${{ env.TEST_ARGS }}
      - name: 3.0.53 -> N
        if: ${{ !cancelled() && inputs.legacy && matrix.format != 'rpm' }}
        run: node scripts/ci/installTest.ts --scenario legacy ${{ env.TEST_ARGS }}
      - name: 3.0.53 -> N (Fedora container)
        if: ${{ !cancelled() && inputs.legacy && matrix.format == 'rpm' }}
        run: >-
          docker run --rm --shm-size=2g
          -v "${GITHUB_WORKSPACE}:/work" -v "$(dirname "$(command -v node)"):/opt/host-node:ro"
          -w /work/packages/filen-desktop "${FEDORA_IMAGE}"
          bash -ec 'dnf install --assumeyes --quiet xorg-x11-server-Xvfb && /opt/host-node/node scripts/ci/installTest.ts "$@"'
          install-test --scenario legacy ${{ env.TEST_ARGS }}
