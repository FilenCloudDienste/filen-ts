# Production deploy of filen-web to Cloudflare (the top-level Worker in packages/filen-web/wrangler.jsonc),
# triggered by a version tag such as `filen-web@1.2.3`. The tag must match package.json's version.
# Secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN (an account API token with only Workers Scripts: Edit; wrangler
# reads it as CLOUDFLARE_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID.
name: Release web

on:
  push:
    tags:
      - 'filen-web@*'

permissions:
  contents: read

concurrency:
  # Queue, never cancel: a deploy is not interrupted halfway.
  group: release-web
  cancel-in-progress: false

jobs:
  release-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#filen-web@}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: ${GITHUB_REF_NAME} (version ${TAG_VERSION}) | package.json version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version (${PKG_VERSION}). Bump the version to ${TAG_VERSION} (or retag) before releasing."
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      # The spellchecker's wasm engine is built from source (packages/filen-spellcheck): rustup installs the
      # toolchain and wasm target that rust-toolchain.toml pins.
      - name: Set up Rust
        working-directory: packages/filen-spellcheck
        run: rustup toolchain install
      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            packages/filen-spellcheck/crate/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/filen-spellcheck/rust-toolchain.toml', 'packages/filen-spellcheck/crate/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      # The dictionaries are built from pinned upstream sources (never committed) and verified against the
      # manifest; a cache hit skips the download.
      - name: Cache spellcheck dictionaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/filen-spellcheck/.dictionaries
          key: spellcheck-dictionaries-${{ hashFiles('packages/filen-spellcheck/dictionaries/manifest.json') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --env="" names the top-level (production) Worker explicitly; staging is the `staging` environment.
        run: pnpm exec wrangler deploy --env="" --message "${GITHUB_REF_NAME} (${GITHUB_SHA})"
