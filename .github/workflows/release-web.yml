# Production deploy of filen-web to Cloudflare (the top-level Worker in packages/filen-web/wrangler.jsonc),
# triggered by a version tag such as `filen-web@1.2.3`. The tag must match package.json's version.
# Secrets: CLOUDFLARE_WORKERS_DEPLOY_TOKEN (an account API token with only Workers Scripts: Edit; wrangler
# reads it as CLOUDFLARE_API_TOKEN) and CLOUDFLARE_ACCOUNT_ID.
name: Release web

on:
  push:
    tags:
      - 'filen-web@*'

permissions:
  contents: read

concurrency:
  # Queue, never cancel: a deploy is not interrupted halfway.
  group: release-web
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  release-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/filen-web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#filen-web@}"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          echo "Tag: ${GITHUB_REF_NAME} (version ${TAG_VERSION}) | package.json version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version (${PKG_VERSION}). Bump the version to ${TAG_VERSION} (or retag) before releasing."
            exit 1
          fi
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @filen/web...
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm test
      - name: Build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: pnpm run build
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --env="" names the top-level (production) Worker explicitly; staging is the `staging` environment.
        run: pnpm exec wrangler deploy --env="" --message "${GITHUB_REF_NAME} (${GITHUB_SHA})"
