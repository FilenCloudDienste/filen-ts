steps:
  - echo: "Prerequisite: signed in, Filen opens on the Drive root sorted by name. The flow makes its own scratch directory 0flowsame at the root and trashes it at the end. Restart Filen and expect the Drive root"
  - launch: io.filen.app
  - await: { visible: { text: { matches: '^Drive$' } }, timeout: 30000 }
  - await: { idle: true }
  - echo: "Dev builds show the LogBox warning banner over the bottom bar; dismiss it (unlabeled close button, raw point)"
  - when: { visible: { text: "Open debugger to view warnings" } }
    steps:
      - tap: { x: 0.92, y: 0.929 }
  - echo: "Set up: create 0flowsame at the root; the leading 0 sorts it to the top of a name-sorted root (header More actions menu: drive-header-more is absent from the iOS runner tree; raw point)"
  - tap: { x: 0.766, y: 0.096 }
  - await: { visible: { text: Create directory } }
  - tap: { text: Create directory }
  - await: { visible: { text: Enter a name for the new directory } }
  - tool: keyboard
    args:
      text: 0flowsame
  - tap: { text: Create }
  - await: { visible: { text: { matches: '^0flowsame \d' } }, timeout: 10000 }
  - await: { idle: true }
  - tap: { text: { matches: '^0flowsame \d' } }
  - await: { visible: { text: This directory is empty }, timeout: 10000 }
  - await: { idle: true }
  - echo: "Set up: create note.txt through the empty-state Add menu"
  - tap: { id: drive-empty-add }
  - await: { visible: { text: Upload } }
  - tap: { text: Upload }
  - await: { visible: { text: Create text file } }
  - tap: { text: Create text file }
  - await: { visible: { text: Enter a name for the new text file } }
  - tool: keyboard
    args:
      text: note.txt
  - tap: { text: Create }
  - echo: "The text editor opens; close it with its unlabeled close button (raw point)"
  - wait: 2500
  - await: { idle: true }
  - tap: { x: 0.094, y: 0.096 }
  - await: { visible: { text: { matches: '^note\.txt \d' } }, timeout: 10000 }
  - await: { idle: true }
  - echo: "Copy note.txt with Copy to… into its own directory"
  - long-press: { on: { text: { matches: '^note\.txt \d' } }, duration: 900 }
  - await: { visible: { text: Versions } }
  - tap: { text: Copy }
  - await: { visible: { text: Copy to… } }
  - tap: { text: Copy to… }
  - await: { visible: { text: Select destination } }
  - await: { idle: true }
  - when: { visible: { text: "Open debugger to view warnings" } }
    steps:
      - tap: { x: 0.92, y: 0.929 }
  - echo: "The picker opens at the root; 0flowsame is at the top. Inside it, note.txt shows (dimmed: files are not destinations)"
  - tap: { text: { matches: '^0flowsame \d' } }
  - await: { visible: { text: { matches: '^note\.txt \d' } }, timeout: 10000 }
  - await: { idle: true }
  - tap: { id: drive-select-copy-here }
  - echo: "Expect the keep-both copy note (1).txt beside note.txt"
  - await: { visible: { text: { matches: '^note \(1\)\.txt \d' } }, timeout: 15000 }
  - assert: { visible: { text: { matches: '^note\.txt \d' } } }
  - echo: "Clean up: back to the root and trash 0flowsame"
  - tap: { id: BackButton }
  - await: { visible: { text: { matches: '^0flowsame \d' } } }
  - await: { idle: true }
  - long-press: { on: { text: { matches: '^0flowsame \d' } }, duration: 900 }
  - await: { visible: { text: Color } }
  - tap: { text: Trash }
  - await: { visible: { text: Are you sure you want to move this item to the trash } }
  - tap: { text: Trash, after: { text: Cancel } }
  - await: { hidden: { text: { matches: '^0flowsame \d' } }, timeout: 15000 }
