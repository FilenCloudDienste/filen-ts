<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static, generic, zero user data: no route ever derives a description or OG tag from a file,
         directory, note or account. Text-only OG — an og:image waits for a real 1200x630 brand asset. -->
    <meta
      name="description"
      content="Filen is end-to-end encrypted cloud storage. Store, sync and share your files with zero-knowledge encryption."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filen" />
    <meta property="og:title" content="Filen" />
    <meta
      property="og:description"
      content="Filen is end-to-end encrypted cloud storage. Store, sync and share your files with zero-knowledge encryption."
    />
    <meta property="og:url" content="https://app.filen.io/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>Filen</title>
    <!-- Paints the canvas colour before the stylesheet loads (theme.js sets the class first); values
         mirror --canvas in src/index.css. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        background: oklch(0.925 0 0);
        color-scheme: light;
      }
      html.dark {
        background: oklch(0.13 0 0);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background: oklch(0.13 0 0);
          color-scheme: dark;
        }
      }
    </style>
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
