<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Static, generic, zero user data: no route ever derives a description or OG tag from a file,
         directory, note or account. Text-only OG — an og:image waits for a real 1200x630 brand asset. -->
    <meta
      name="description"
      content="Filen is end-to-end encrypted cloud storage. Store, sync and share your files with zero-knowledge encryption."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filen" />
    <meta property="og:title" content="Filen" />
    <meta
      property="og:description"
      content="Filen is end-to-end encrypted cloud storage. Store, sync and share your files with zero-knowledge encryption."
    />
    <meta property="og:url" content="https://app.filen.io/" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <title>Filen</title>
    <!-- Paints the canvas colour and the boot splash before the stylesheet loads (theme.js sets the class
         first); values mirror --canvas, --primary and --muted-foreground in src/index.css. -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html {
        --boot-canvas: oklch(0.925 0 0);
        --boot-mark: oklch(0.205 0 0);
        --boot-track: oklch(0.5 0 0 / 0.2);
        background: var(--boot-canvas);
        color-scheme: light;
      }
      html.dark {
        --boot-canvas: oklch(0.13 0 0);
        --boot-mark: oklch(0.922 0 0);
        --boot-track: oklch(0.708 0 0 / 0.2);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          --boot-canvas: oklch(0.13 0 0);
          --boot-mark: oklch(0.922 0 0);
          --boot-track: oklch(0.708 0 0 / 0.2);
          color-scheme: dark;
        }
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: var(--boot-canvas);
        color: var(--boot-mark);
        transition: opacity 200ms ease-out;
      }
      #boot-splash > svg {
        width: 48px;
        height: 48px;
      }
      #boot-splash > div {
        width: 128px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: var(--boot-track);
      }
      #boot-splash > div > div {
        height: 100%;
        background: currentColor;
        transform: scaleX(0.08);
        transform-origin: left;
        transition: transform 300ms ease-out;
      }
      #boot-splash.boot-splash-out {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash,
        #boot-splash > div > div {
          transition: none;
        }
      }
    </style>
    <script src="/theme.js"></script>
  </head>
  <body>
