packages:
  - packages/*

nodeLinker: isolated
# npm-check-updates 23.x wants node 24.15+; a workspace-wide strict check would fail on
# older 24.x. pnpm still warns on engine mismatches. Flip to true once every dev machine
# runs node >= 24.15.
engineStrict: false
strictDepBuilds: true
# @filen/sdk-rs depends on a git fork of uniffi-bindgen-react-native; pnpm 12 blocks
# git-resolved subdependencies by default. Remove once the SDK depends on a registry release.
blockExoticSubdeps: false
# Heap ceiling for every script pnpm runs (NODE_OPTIONS, replacing one set outside pnpm): filen-web's
# type-aware eslint and tsc outgrow Node's default ~4 GB heap, locally and on the CI runners.
nodeOptions: --max-old-space-size=16384
# filen-desktop packages a mac/linux build per CPU from one machine, so both CPUs' platform packages
# (the @filen/sdk-rs napi addon among them) must install.
supportedArchitectures:
  os: [current]
  cpu: [x64, arm64]
  libc: [glibc]

packageExtensions:
  # Imports react-native without declaring it, so it would resolve whichever copy pnpm
  # hoists; a second copy in the mobile type program breaks ViewStyle assignability.
  '@expo/react-native-action-sheet':
    peerDependencies:
      react-native: '*'

# react-native-worklets accepts any @react-native/metro-config; keep the one that matches
# react-native 0.88.0 instead of the latest. Remove when worklets narrows its peer range.
overrides:
  # @peculiar/x509 (desktop TLS) breaks with two copies of asn1-schema ("Cannot get schema for
  # 'BasicConstraints'"), so the whole tree shares one. Drop once the @peculiar packages agree on their own.
  '@peculiar/asn1-schema': 2.11.1
  '@react-native/metro-config': 0.88.0
  # uniwind's metro peers are `*`; keep them on the Metro line Expo's metro-config ships (0.87.1),
  # and its optional @expo/metro-config peer on Expo's own copy (its transformer hands every JS file
  # to that worker). Bump together with expo; remove when uniwind narrows its peer ranges.
  'uniwind>@expo/metro-config': 58.0.19
  'uniwind>metro': 0.87.1
  'uniwind>metro-cache': 0.87.1
  'uniwind>metro-transform-worker': 0.87.1

# pnpm's default one-day minimumReleaseAge stays on for third-party packages. First-party ones are released
# and adopted the same day, so they are exempt by name, never per version; pruning drops one-off exemptions
# for third-party versions the lockfile no longer resolves.
minimumReleaseAgeExclude:
  - '@filen/*'
  - '@expo/cli@58.1.17'
  - '@expo/config-plugins@58.0.11'
  - '@expo/config@58.0.9'
  - '@expo/image-utils@0.12.6'
  - '@expo/inline-modules@0.2.8'
  - '@expo/local-build-cache-provider@58.0.9'
  - '@expo/metro-config@58.0.19'
  - '@expo/modules-macros-linux-arm64@0.27.1'
  - '@expo/modules-macros-linux-x64@0.27.1'
  - '@expo/modules-macros-win32-arm64@0.27.1'
  - '@expo/modules-macros-win32-x64@0.27.1'
  - '@expo/prebuild-config@58.0.17'
  - '@expo/require-utils@58.0.5'
  - '@expo/router-server@58.0.19'
  - '@expo/ui@58.0.25'
  - babel-preset-expo@58.0.22
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-image-manipulator@58.0.16
  - expo-image@58.0.18
  - expo-linking@58.0.15
  - expo-media-library@58.0.13
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
  - expo-modules-core@58.0.28
  - expo-modules-jsi@58.0.21
  - expo-modules-macros@0.27.1
  - expo-router@58.0.28
  - expo-sharing@58.0.21
  - expo-splash-screen@58.0.12
  - expo-system-ui@58.0.7
  - expo-video@58.0.13
  - expo@58.0.21
minimumReleaseAgeExcludePrune: true

allowBuilds:
  esbuild: true
  workerd: true
  fsevents: true
  unrs-resolver: true
  electron: true
  electron-winstaller: true
  # The postinstall only builds llama.cpp from source when no prebuilt binary matches the host.
  node-llama-cpp: false
  # Keyed by the exact git resolution; update it together with sdk-rs's uniffi-bindgen-react-native ref.
  "uniffi-bindgen-react-native@https://codeload.github.com/Enduriel/uniffi-bindgen-react-native/tar.gz/e0282ad3eb972eaea74225dcc06247b7a67204dd": true
patchedDependencies:
  '@blazejkustra/react-native-alert@1.1.1': patches/@blazejkustra__react-native-alert@1.1.1.patch
  '@expo/dom-webview@58.0.2': patches/@expo__dom-webview@58.0.2.patch
  '@filen/sdk-rs@0.5.11': patches/@filen__sdk-rs@0.5.11.patch
  '@react-native-menu/menu@2.0.0': patches/@react-native-menu__menu@2.0.0.patch
  '@shopify/flash-list@2.3.3': patches/@shopify__flash-list@2.3.3.patch
  '@wllama/wllama@3.8.1': patches/@wllama__wllama@3.8.1.patch
  expo-audio@58.0.10: patches/expo-audio@58.0.10.patch
  expo-background-task@58.0.11: patches/expo-background-task@58.0.11.patch
  expo-document-picker@58.0.4: patches/expo-document-picker@58.0.4.patch
  expo-file-system@58.0.13: patches/expo-file-system@58.0.13.patch
  expo-image-manipulator@58.0.16: patches/expo-image-manipulator@58.0.16.patch
  expo-image@58.0.18: patches/expo-image@58.0.18.patch
  expo-sharing@58.0.21: patches/expo-sharing@58.0.21.patch
  expo-video@58.0.13: patches/expo-video@58.0.13.patch
  file-type@22.2.0: patches/file-type@22.2.0.patch
  hucre@1.2.0: patches/hucre@1.2.0.patch
  mediabunny@1.62.1: patches/mediabunny@1.62.1.patch
  pressto@0.7.0: patches/pressto@0.7.0.patch
  react-native-ios-utilities@5.2.0: patches/react-native-ios-utilities@5.2.0.patch
  react-native-notify-kit@10.9.0: patches/react-native-notify-kit@10.9.0.patch
  react-native-reorderable-list@0.18.2: patches/react-native-reorderable-list@0.18.2.patch
  react-native-screens@4.30.0: patches/react-native-screens@4.30.0.patch
  react-native-svg@15.16.0: patches/react-native-svg@15.16.0.patch
